<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Portal — SK Presidency Public School</title>
<style>
:root{--p:#4285F4;--pd:#1557B0;--g:#34A853;--r:#EA4335;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:14px;--rr:28px;--f:'Google Sans','Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;--sh:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:linear-gradient(160deg,#0f172a 0%,#1e293b 40%,#0d1b2a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--w);border-radius:24px;width:100%;max-width:460px;overflow:hidden;box-shadow:var(--sh);animation:fadeIn .5s cubic-bezier(.16,1,.3,1)}
/* Header */
.top{background:linear-gradient(135deg,#1a237e,#0d47a1,#4285F4);padding:28px 28px 24px;text-align:center;color:#fff;position:relative;overflow:hidden}
.top::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:2px solid rgba(255,255,255,.04);top:-100px;right:-80px}
.top::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(255,255,255,.03);bottom:-60px;left:-50px}
.idc{border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;background:rgba(255,255,255,.04);display:inline-block;margin-bottom:12px;position:relative;z-index:1}.idc .logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;margin:0 auto 6px}.idc .logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}.idc .sn{font-size:10px;font-weight:700;letter-spacing:.5px}.idc .ss{font-size:8px;opacity:.4}
.top h2{font-size:22px;font-weight:500;letter-spacing:-.3px;position:relative;z-index:1}.top p{font-size:12px;opacity:.65;margin-top:4px;position:relative;z-index:1}
/* Body */
.body{padding:24px 28px 20px}
.tabs{display:flex;background:var(--g100);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:11px;transition:all .2s;font-family:var(--f)}
.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
/* Input */
.ig{position:relative;margin-bottom:14px}.ig svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}
.ig:focus-within svg{color:var(--p)}.ig input{width:100%;padding:13px 14px 13px 44px;border:2px solid var(--g200);border-radius:var(--r);font-size:14px;font-family:var(--f);background:var(--g50);transition:all .3s}
.ig input:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(66,133,244,.08)}
/* Buttons */
.btn{width:100%;padding:13px;background:var(--p);color:#fff;border:none;border-radius:var(--rr);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--f);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--pd);box-shadow:0 4px 16px rgba(66,133,244,.3);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-g{background:var(--g)}.btn-g:hover{opacity:.9}
/* Msgs */
.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ok{background:#ECFDF5;color:#059669;padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none;border-left:3px solid var(--g)}.ok.show{display:block}
.ft{text-align:center;padding:0 0 22px;font-size:11px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none}.tc{display:none}.tc.active{display:block}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
/* Student list */
.student-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:240px;overflow-y:auto}
.st-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--g200);border-radius:var(--r);cursor:pointer;transition:all .2s;background:var(--w)}
.st-row:hover{border-color:var(--p);background:#F8FAFF}
.st-row.selected{border-color:var(--p);background:#E8F0FE;box-shadow:0 0 0 3px rgba(66,133,244,.1)}
.st-row .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p),#0d47a1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;flex-shrink:0}
.st-row .info{flex:1;min-width:0}.st-row .info .nm{font-size:14px;font-weight:500;color:var(--g800)}.st-row .info .mt{font-size:11px;color:var(--g500)}
.st-row .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.st-row.selected .chk{background:var(--p);border-color:var(--p)}.st-row.selected .chk::after{content:'\2713';color:#fff;font-size:12px;font-weight:700}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--p);font-size:12px;font-weight:500;cursor:pointer;background:none;border:none;font-family:var(--f);margin-bottom:12px;padding:4px 0}
.scan-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;padding:10px;border:1.5px dashed var(--g300);border-radius:var(--r);font-size:13px;color:var(--p);font-weight:500;text-decoration:none;transition:all .2s}
.scan-link:hover{border-color:var(--p);background:#F8FAFF}
@keyframes fadeIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
<div class="top">
<div class="idc"><div class="logo"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="sn">SK PRESIDENCY PUBLIC SCHOOL</div><div class="ss">CBSE: 2133231 | Sultanpur, UP</div></div>
<h2>Student Portal</h2><p>Sign in to your dashboard</p>
</div>
<div class="body">
<a href="student-scan.html" class="scan-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scan ID Card to Login</a>
<div class="tabs"><button class="active" onclick="switchTab('id')">Student ID</button><button onclick="switchTab('mobile')">Mobile</button></div>
<div class="err" id="err"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<div class="ok" id="okMsg"></div>
<form id="fid" class="tc active" onsubmit="return loginByID(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><input type="text" name="sid" placeholder="Student ID or Roll Number" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="pw" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="submit" class="btn" id="btnID"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<form id="fmb" class="tc" onsubmit="return false"><div id="mStep1"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><input type="tel" id="mobInput" placeholder="Registered Mobile Number" autocomplete="off" maxlength="10"></div><button type="button" class="btn" onclick="lookupMobile()" id="btnMobile"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account</button><div style="text-align:center;margin-top:8px;font-size:10px;color:var(--g500)">All students with this number will appear</div></div><div id="mStep2" style="display:none"><button type="button" class="back-btn" onclick="goBackToMobile()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Change mobile number</button><p style="font-size:11px;color:var(--g500);margin-bottom:10px">Select your name:</p><div class="student-list" id="studentList"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="pwMobile" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="button" class="btn btn-g" onclick="loginSelected()" id="btnLoginSelected"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In as Selected</button></div></form>
</div><div class="ft"><a href="index.html">Back to School Website</a><br><span style="margin-top:4px;display:block;font-size:10px">Default password: Date of Birth (DDMMYYYY)</span></div></div>

<script>
(function(){
  window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}
  var _f=null,_p=null,_a=null;
  window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db&&_a&&_a.currentUser)return ok(_f);if(!FIREBASE_CONFIG.apiKey){ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}var loaded=false,to=setTimeout(function(){if(!loaded){loaded=true;ok(null)}},15000);Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_a=firebase.auth();var db=firebase.firestore();function done(){if(loaded)return;loaded=true;clearTimeout(to);_f={db:db,auth:_a};try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}ok(_f)}var unsub=_a.onAuthStateChanged(function(user){unsub();if(user){done()}else{_a.signInAnonymously().then(done).catch(function(e){done()})}})}).catch(function(e){if(!loaded){loaded=true;clearTimeout(to);ok(null)}})});return _p};
  window.fbFindStudent=async function(id){var f=await _fbReady();if(!f)throw new Error("Firebase not connected — run firebase-setup.html");var d=await f.db.collection('students').doc(id).get();if(d.exists){var r=d.data();r.student_id=d.id;return r}return null};
  window.fbFindStudentsByPhone=async function(phone){var f=await _fbReady();if(!f)throw new Error("Firebase not connected — run firebase-setup.html");var s=await f.db.collection('students').where('parent_phone','==',phone).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r}).filter(function(r){return r.is_active!==false})};
  window.fbGetStudents=async function(){var f=await _fbReady();if(!f)throw new Error("Firebase not connected — run firebase-setup.html");var s=await f.db.collection('students').where('is_active','==',true).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r})};
})();

var curTab='id',mobileStudents=[],selectedStudent=null;
function switchTab(t){curTab=t;document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="id"&&i===0)||(t==="mobile"&&i===1))});document.getElementById("fid").classList.toggle("active",t==="id");document.getElementById("fmb").classList.toggle("active",t==="mobile");hideMsgs()}
function showErr(m){document.getElementById("et").textContent=m;document.getElementById("err").classList.add("show");document.getElementById("okMsg").classList.remove("show")}
function showOk(m){document.getElementById("okMsg").textContent=m;document.getElementById("okMsg").classList.add("show");document.getElementById("err").classList.remove("show")}
function hideMsgs(){document.getElementById("err").classList.remove("show");document.getElementById("okMsg").classList.remove("show")}
function goDash(st){sessionStorage.setItem("skpps_auth","1");sessionStorage.setItem("skpps_name",st.full_name||st.name);sessionStorage.setItem("skpps_class",st.class||st.cls);sessionStorage.setItem("skpps_section",st.section||st.sec||"A");sessionStorage.setItem("skpps_roll",String(st.roll_no||st.roll||""));sessionStorage.setItem("skpps_house",st.house||"Earth");sessionStorage.setItem("skpps_role","student");sessionStorage.setItem("skpps_sid",st.student_id||st.sid);sessionStorage.setItem("skpps_student",JSON.stringify(st));location.href="student/dashboard.html"}
function verifyPassword(st,pw){var dp=(st.date_of_birth||st.dob||"").replace(/-/g,"").substring(0,8),sp=st.password||dp;return pw===dp||pw===sp}

async function loginByID(e){e.preventDefault();var sid=this.querySelector('[name=sid]').value.trim(),pw=this.querySelector('[name=pw]').value.trim();if(!sid||!pw){showErr("Please fill both fields");return false}hideMsgs();var b=document.getElementById("btnID");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';try{var st=await fbFindStudent(sid);if(!st){var all=await fbGetStudents();for(var i=0;i<all.length;i++){if(all[i].roll_no==parseInt(sid)||all[i].admission_no===sid){st=all[i];break}}}if(st){if(verifyPassword(st,pw)){goDash(st);return}else{showErr("Invalid password. Default is DOB (DDMMYYYY).");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In';return false}}else{showErr("Student not found. Check your ID.");b.disabled=false;b.innerHTML='Sign In';return false}}catch(e){showErr(e.message||"Login error");b.disabled=false;b.innerHTML='Sign In'}}

async function lookupMobile(){var mob=document.getElementById("mobInput").value.replace(/\D/g,'');if(mob.length!==10){showErr("Enter valid 10-digit mobile");return}hideMsgs();var b=document.getElementById("btnMobile");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Searching...';try{mobileStudents=await fbFindStudentsByPhone(mob);if(!mobileStudents||!mobileStudents.length){showErr("No student with this number. Verify or contact school office.");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account';return}showOk("Found "+mobileStudents.length+" student(s). Select your name.");document.getElementById("mStep1").style.display="none";document.getElementById("mStep2").style.display="block";renderStudentList()}catch(e){showErr(e.message||"Search failed")}b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account'}
function renderStudentList(){var h='';for(var i=0;i<mobileStudents.length;i++){var s=mobileStudents[i],nm=s.full_name||s.name,cl=s.class||s.cls,sc=s.section||s.sec||'A',rn=s.roll_no||s.roll||'';h+='<div class="st-row" onclick="selectStudent('+i+',this)"><div class="av">'+nm.charAt(0).toUpperCase()+'</div><div class="info"><div class="nm">'+es(nm)+'</div><div class="mt">Class '+es(cl)+'-'+es(sc)+' | Roll '+es(rn)+'</div></div><div class="chk"></div></div>'}document.getElementById("studentList").innerHTML=h;selectedStudent=null}
function selectStudent(idx,el){document.querySelectorAll(".st-row").forEach(function(r){r.classList.remove("selected")});el.classList.add("selected");selectedStudent=mobileStudents[idx];hideMsgs()}
function goBackToMobile(){document.getElementById("mStep1").style.display="block";document.getElementById("mStep2").style.display="none";mobileStudents=[];selectedStudent=null;hideMsgs()}
async function loginSelected(){if(!selectedStudent){showErr("Select your name from the list");return}var pw=document.getElementById("pwMobile").value.trim();if(!pw){showErr("Enter your password");return}hideMsgs();var b=document.getElementById("btnLoginSelected");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';if(verifyPassword(selectedStudent,pw)){goDash(selectedStudent);return}showErr("Invalid password. Default is DOB (DDMMYYYY).");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In as Selected'}
function es(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
