<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - SK Presidency Public School</title>
<script src="firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--hr:#E74C3C;--hb:#3498DB;--hg:#27AE60;--w:#fff;--g50:#F8F9FA;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g900:#202124;--r:8px;--rm:14px;--f:'Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:linear-gradient(160deg,#0f172a,#1e293b,#0d1b2a,#1a1a3e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;border-radius:var(--rm);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.15);animation:fadeIn .5s}@media(max-width:720px){.wrap{grid-template-columns:1fr;max-width:420px}}
.left{background:linear-gradient(150deg,#1a2a40,#0d1630);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:white;position:relative;overflow:hidden}
.left .id-card{border:2px solid rgba(255,255,255,.15);border-radius:var(--r);padding:clamp(14px,2vw,20px);background:rgba(255,255,255,.05);margin-bottom:14px;width:100%;max-width:220px}
.left .id-card .logo{width:clamp(45px,6vw,60px);height:clamp(45px,6vw,60px);border-radius:50%;background:white;padding:4px;margin:0 auto 8px;box-shadow:0 4px 12px rgba(0,0,0,.3)}.left .id-card .logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.left .id-card .sn{font-size:clamp(10px,1.1vw,12px);font-weight:700;letter-spacing:.5px}.left .id-card .ss{font-size:clamp(8px,.9vw,9px);opacity:.6;margin-bottom:6px}
.left .stripes{display:flex;gap:3px;margin-top:8px}.left .stripes div{width:clamp(24px,3vw,36px);height:3px;border-radius:2px}.left .stripes div:nth-child(1){background:var(--hr)}.left .stripes div:nth-child(2){background:var(--hb)}.left .stripes div:nth-child(3){background:var(--hg)}.left .stripes div:nth-child(4){background:#F39C12}
.right{background:var(--w);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;justify-content:center}
.right h2{font-size:clamp(17px,2vw,22px);font-weight:700;margin-bottom:2px}.right .sub{font-size:12px;color:var(--g600);margin-bottom:18px}
.tabs{display:flex;border:1.5px solid var(--g200);border-radius:var(--r);overflow:hidden;margin-bottom:16px}.tabs button{flex:1;padding:9px;border:none;background:white;font-size:11px;font-weight:500;cursor:pointer;color:var(--g600);font-family:inherit;transition:all .2s}.tabs button.active{background:var(--p);color:white;font-weight:600}
.ig{position:relative;margin-bottom:10px}.ig svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g300);z-index:2;pointer-events:none}.ig input,.ig select{width:100%;padding:10px 10px 10px 38px;border:2px solid var(--g200);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--g50);transition:all .3s}.ig input:focus,.ig select:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 3px rgba(26,115,232,.08)}.ig select{appearance:none;cursor:pointer}
.btn{width:100%;padding:12px;background:var(--p);color:white;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#1557B0;transform:translateY(-2px);box-shadow:0 5px 16px rgba(26,115,232,.3)}.btn:disabled{opacity:.6;transform:none!important}
.err{background:#FEF2F2;color:#DC2626;padding:9px 12px;border-radius:var(--r);font-size:11px;margin-bottom:10px;display:none;border-left:3px solid #DC2626;align-items:center;gap:7px}.err.show{display:flex}
.ft{text-align:center;padding-top:14px;border-top:1px solid var(--g200);margin-top:16px;font-size:10px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none}.tc{display:none}.tc.active{display:block}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}.scan-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;font-size:12px;color:var(--p);font-weight:600;text-decoration:none;padding:8px;border:1.5px dashed var(--g300);border-radius:var(--r);transition:all .2s}.scan-link:hover{border-color:var(--p);background:#f8faff}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
<div class="left"><div class="id-card"><div class="logo"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="sn">SK PRESIDENCY PUBLIC SCHOOL</div><div class="ss">Sultanpur, UP | CBSE: 2133231</div><div style="width:100%;height:1px;background:rgba(255,255,255,.15);margin:6px 0"></div><div style="width:40px;height:50px;background:rgba(255,255,255,.1);border-radius:4px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div style="font-size:8px;opacity:.5;line-height:1.4">Name: ...............<br>Class: .......<br>Roll No: ......</div></div><div class="stripes"><div></div><div></div><div></div><div></div></div></div>
<div class="right"><h2>Student Portal</h2><p class="sub">Sign in to access your dashboard</p>
<a href="student-scan.html" class="scan-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scan ID Card to Login</a>
<div class="tabs"><button class="active" onclick="swTab('id')">Student ID</button><button onclick="swTab('mobile')">Mobile</button></div>
<div class="err" id="err"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<form id="fi" class="tc active" onsubmit="return loginID(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><input type="text" name="student_id" placeholder="Student ID / Roll Number" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="password" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="submit" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<form id="fm" class="tc" onsubmit="return loginMobile(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><input type="tel" name="mobile" placeholder="Mobile Number (Registered)" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" name="student_name" placeholder="Full Name (as per records)" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg><select name="class"><option value="">Select Class</option><option>Nursery</option><option>LKG</option><option>UKG</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option>VI</option><option>VII</option><option>VIII</option><option>IX</option><option>X</option><option>XI</option><option>XII</option></select></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="password" placeholder="Password" autocomplete="off"></div><button type="submit" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<div class="ft"><a href="index.html">Back to School Website</a><br><span style="margin-top:2px;display:block">Default password: Date of Birth (DDMMYYYY)</span></div></div></div>

<script>
function swTab(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="id"&&i===0)||(t==="mobile"&&i===1))});document.getElementById("fi").classList.toggle("active",t==="id");document.getElementById("fm").classList.toggle("active",t==="mobile");he()}
function se(m){document.getElementById("et").textContent=m;document.getElementById("err").classList.add("show")}function he(){document.getElementById("err").classList.remove("show")}
function goDash(st){sessionStorage.setItem("skpps_auth","1");sessionStorage.setItem("skpps_name",st.full_name||st.name);sessionStorage.setItem("skpps_class",st.class||st.cls);sessionStorage.setItem("skpps_section",st.section||st.sec||"A");sessionStorage.setItem("skpps_roll",String(st.roll_no||st.roll||""));sessionStorage.setItem("skpps_house",st.house||"Earth");sessionStorage.setItem("skpps_role","student");sessionStorage.setItem("skpps_sid",st.student_id||st.sid);sessionStorage.setItem("skpps_student",JSON.stringify(st));location.href="student/dashboard.html"}

async function loginID(e){e.preventDefault();var sid=this.querySelector('[name=student_id]').value.trim(),pw=this.querySelector('[name=password]').value.trim();if(!sid||!pw){se("Please fill all fields");return false}he();
  try{var st=await fbFindStudent(sid);if(st){var dp=(st.date_of_birth||st.dob||"").replace(/-/g,"").substring(0,8),sp=st.password||dp;if(pw===dp||pw===sp){goDash(st);return}else{se("Invalid password");return}}else{se("Student not found");return}}catch(e){se("Login failed. Try again.");return false}}

async function loginMobile(e){e.preventDefault();var mob=this.querySelector('[name=mobile]').value.trim(),name=this.querySelector('[name=student_name]').value.trim(),cls=this.querySelector('[name=class]').value,pw=this.querySelector('[name=password]').value.trim();if(!mob||!name||!cls||!pw){se("Please fill all fields");return false}he();
  try{var all=await fbGetStudents();if(!all||!all.length){se("No students in database");return false}
  for(var i=0;i<all.length;i++){var s=all[i];if(s.parent_phone===mob&&s.class===cls&&s.full_name.toLowerCase().includes(name.toLowerCase())){var dp=(s.date_of_birth||"").replace(/-/g,"").substring(0,8),sp=s.password||dp;if(pw===dp||pw===sp){goDash(s);return}else{se("Invalid password");return}}}se("Student not found");return false}catch(e){se("Login failed")}}
</script></body></html>
