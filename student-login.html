<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Portal — SK Presidency Public School</title>
<script src="firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--pd:#1557B0;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:12px;--rr:28px;--f:'Google Sans','Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:linear-gradient(135deg,#1a1a2e,#16213e,#0d1b2a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:860px;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fadeIn .5s}@media(max-width:680px){.wrap{grid-template-columns:1fr;max-width:420px}}
.left{background:linear-gradient(150deg,#1a2a40,#0d1630);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:white;position:relative;overflow:hidden}
.left::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;border:2px solid rgba(255,255,255,.04);top:-80px;right:-60px}.left::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;border:2px solid rgba(255,255,255,.03);bottom:-40px;left:-40px}
.idc{border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:clamp(14px,2vw,20px);background:rgba(255,255,255,.04);margin-bottom:14px;width:100%;max-width:200px;position:relative;z-index:1}
.logo{width:clamp(44px,5vw,56px);height:clamp(44px,5vw,56px);border-radius:50%;background:white;padding:4px;margin:0 auto 8px}.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.idc .sn{font-size:clamp(10px,1vw,12px);font-weight:600;letter-spacing:.5px}.idc .ss{font-size:clamp(8px,.8vw,9px);opacity:.5;margin-bottom:6px}.idc .line{width:100%;height:1px;background:rgba(255,255,255,.1);margin:6px 0}
.idc .ph{width:36px;height:44px;background:rgba(255,255,255,.08);border-radius:4px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}.idc .ph svg{width:18px;height:18px;opacity:.3}.idc .info{font-size:clamp(7px,.7vw,8px);opacity:.4;line-height:1.5;text-align:left}
.right{background:var(--w);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;justify-content:center}
.right h2{font-size:clamp(17px,2vw,22px);font-weight:500;margin-bottom:2px}.right .sub{font-size:12px;color:var(--g600);margin-bottom:20px}
.tabs{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:18px}.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:12px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:10px;transition:all .2s;font-family:inherit}.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.ig{position:relative;margin-bottom:12px}.ig svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}.ig:focus-within svg{color:var(--p)}.ig input,.ig select{width:100%;padding:12px 12px 12px 44px;border:2px solid var(--g200);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--g50);transition:all .3s}.ig input:focus,.ig select:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 4px rgba(26,115,232,.08)}.ig select{appearance:none;cursor:pointer}
.btn{width:100%;padding:13px;background:var(--p);color:white;border:none;border-radius:var(--rr);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:var(--pd);box-shadow:0 4px 16px rgba(26,115,232,.3);transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ft{text-align:center;padding-top:14px;border-top:1px solid var(--g200);margin-top:16px;font-size:11px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none}.tc{display:none}.tc.active{display:block}.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
.scan-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;padding:10px;border:1.5px dashed var(--g300);border-radius:var(--r);font-size:13px;color:var(--p);font-weight:500;text-decoration:none;transition:all .2s}.scan-link:hover{border-color:var(--p);background:#F8FAFF}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
<div class="left"><div class="idc"><div class="logo"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="sn">SK PRESIDENCY PUBLIC SCHOOL</div><div class="ss">Sultanpur, UP | CBSE: 2133231</div><div class="line"></div><div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="info">Name: ...............<br>Class: .......<br>Roll No: ......</div></div></div>
<div class="right"><h2>Student Portal</h2><p class="sub">Sign in to access your dashboard</p>
<a href="student-scan.html" class="scan-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scan ID Card to Login</a>
<div class="tabs"><button class="active" onclick="swS('id')">Student ID</button><button onclick="swS('mobile')">Mobile</button></div>
<div class="err" id="er2"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et2"></span></div>
<form id="fid" class="tc active" onsubmit="return loginID(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><input type="text" name="sid" placeholder="Student ID or Roll Number" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="pw" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="submit" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<form id="fmb" class="tc" onsubmit="return loginMob(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><input type="tel" name="mob" placeholder="Mobile Number (Registered)" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" name="sname" placeholder="Full Name (as on ID Card)" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg><select name="cls"><option value="">Select Class</option><option>Nursery</option><option>LKG</option><option>UKG</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option>VI</option><option>VII</option><option>VIII</option><option>IX</option><option>X</option><option>XI</option><option>XII</option></select></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="pw" placeholder="Password" autocomplete="off"></div><button type="submit" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<div class="ft"><a href="index.html">Back to School Website</a><br><span style="margin-top:3px;display:block;font-size:10px">Default password: Date of Birth (DDMMYYYY)</span></div></div></div>
<script>
function swS(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="id"&&i===0)||(t==="mobile"&&i===1))});document.getElementById("fid").classList.toggle("active",t==="id");document.getElementById("fmb").classList.toggle("active",t==="mobile");he2()}
function se2(m){document.getElementById("et2").textContent=m;document.getElementById("er2").classList.add("show")}function he2(){document.getElementById("er2").classList.remove("show")}
function goDash(st){sessionStorage.setItem("skpps_auth","1");sessionStorage.setItem("skpps_name",st.full_name||st.name);sessionStorage.setItem("skpps_class",st.class||st.cls);sessionStorage.setItem("skpps_section",st.section||st.sec||"A");sessionStorage.setItem("skpps_roll",String(st.roll_no||st.roll||""));sessionStorage.setItem("skpps_house",st.house||"Earth");sessionStorage.setItem("skpps_role","student");sessionStorage.setItem("skpps_sid",st.student_id||st.sid);sessionStorage.setItem("skpps_student",JSON.stringify(st));location.href="student/dashboard.html"}
async function loginID(e){e.preventDefault();var sid=this.querySelector('[name=sid]').value.trim(),pw=this.querySelector('[name=pw]').value.trim();if(!sid||!pw){se2("Please fill all fields");return false}he2();
try{var st=await fbFindStudent(sid);if(st){var dp=(st.date_of_birth||st.dob||"").replace(/-/g,"").substring(0,8),sp=st.password||dp;if(pw===dp||pw===sp){goDash(st);return}else{se2("Invalid password");return}}else{se2("Student not found. Check your Student ID.");return}}catch(e){se2("Login failed. Try again.");return false}}
async function loginMob(e){e.preventDefault();var mob=this.querySelector('[name=mob]').value.trim(),name=this.querySelector('[name=sname]').value.trim(),cls=this.querySelector('[name=cls]').value,pw=this.querySelector('[name=pw]').value.trim();if(!mob||!name||!cls||!pw){se2("Please fill all fields");return false}he2();
try{var all=await fbGetStudents();if(!all||!all.length){se2("No students in database");return false}
for(var i=0;i<all.length;i++){var s=all[i];
  if(s.parent_phone===mob&&s.class===cls&&s.full_name.toLowerCase().includes(name.toLowerCase())){
    var dp=(s.date_of_birth||"").replace(/-/g,"").substring(0,8),sp=s.password||dp;if(pw===dp||pw===sp){goDash(s);return}else{se2("Invalid password");return}}}
se2("Student not found. Check your mobile, name, and class.");return false}catch(e){se2("Login failed");return false}}
</script></body></html>
