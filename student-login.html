<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Student Portal — SK Presidency Public School</title>
<style>
:root{--p:#4285F4;--pd:#1557B0;--g:#34A853;--r:#EA4335;--y:#FBBC04;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--rx:10px;--rr:24px;--f:'Google Sans','Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:linear-gradient(155deg,#080c20 0%,#101630 30%,#151d45 60%,#0a0e25 100%);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:550px;height:550px;border-radius:50%;background:radial-gradient(circle,rgba(66,133,244,.12),transparent 70%);top:-180px;right:-120px}
body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(52,168,83,.08),transparent 70%);bottom:-120px;left:-80px}
/* Floating dots */
.dots{position:absolute;inset:0;pointer-events:none;z-index:0}.dots span{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.15);border-radius:50%;animation:float 6s ease-in-out infinite}.dots span:nth-child(1){top:10%;left:15%;animation-delay:0s}.dots span:nth-child(2){top:20%;right:20%;animation-delay:1s}.dots span:nth-child(3){bottom:30%;left:25%;animation-delay:2s}.dots span:nth-child(4){top:60%;right:10%;animation-delay:3s}.dots span:nth-child(5){bottom:15%;right:30%;animation-delay:4s}.dots span:nth-child(6){top:40%;left:5%;animation-delay:5s}

.card{background:rgba(255,255,255,.97);border-radius:22px;width:100%;max-width:430px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.05);position:relative;z-index:1;animation:scaleIn .6s cubic-bezier(.16,1,.3,1)}

/* Header */
.top{background:linear-gradient(135deg,#1a237e 0%,#0d47a1 50%,#4285F4 100%);padding:28px 22px 24px;text-align:center;color:var(--w);position:relative;overflow:hidden}
.top::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;border:1.5px solid rgba(255,255,255,.05);top:-80px;right:-60px}
.top::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;border:1.5px solid rgba(255,255,255,.03);bottom:-50px;left:-40px}
.logo-wrap{border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 16px;background:rgba(255,255,255,.06);display:inline-block;margin-bottom:10px;position:relative;z-index:1;backdrop-filter:blur(4px)}
.logo-wrap .logo-img{width:44px;height:44px;border-radius:50%;background:var(--w);padding:2px;margin:0 auto 6px}.logo-wrap .logo-img img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.logo-wrap .ln{font-size:10px;font-weight:700;letter-spacing:.6px}.logo-wrap .ls{font-size:7px;opacity:.45;letter-spacing:.3px}
.top h2{font-size:22px;font-weight:500;letter-spacing:-.3px;position:relative;z-index:1}.top p{font-size:11px;opacity:.6;margin-top:2px;position:relative;z-index:1}

/* Body */
.body{padding:20px 22px 14px}
.tabs{display:flex;background:var(--g100);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:11px;transition:all .2s;font-family:var(--f)}
.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:600}

/* Input */
.ig{position:relative;margin-bottom:12px}.ig svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}
.ig:focus-within svg{color:var(--p)}.ig input{width:100%;padding:12px 14px 12px 42px;border:2px solid var(--g200);border-radius:var(--rx);font-size:14px;font-family:var(--f);background:var(--g50);transition:all .3s;color:var(--g900)}
.ig input:focus{outline:none;border-color:var(--p);background:var(--w);box-shadow:0 0 0 4px rgba(66,133,244,.07);transform:translateY(-1px)}
.ig input::placeholder{color:var(--g400)}

/* Button */
.btn{width:100%;padding:12px;background:var(--p);color:var(--w);border:none;border-radius:var(--rr);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--f);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--pd);box-shadow:0 6px 24px rgba(66,133,244,.35);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-g{background:var(--g)}.btn-g:hover{background:#2d8f46;box-shadow:0 6px 24px rgba(52,168,83,.35)}

/* Messages */
.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--rx);font-size:12px;margin-bottom:10px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ok{background:#ECFDF5;color:#059669;padding:10px 14px;border-radius:var(--rx);font-size:12px;margin-bottom:10px;display:none;border-left:3px solid var(--g)}.ok.show{display:block}

/* Footer */
.ft{text-align:center;padding:0 0 18px;font-size:10px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none;transition:color .2s}.ft a:hover{color:var(--p)}.tc{display:none}.tc.active{display:block}

/* Spinner */
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--w);border-radius:50%;animation:spin .7s linear infinite;display:none}

/* Student list */
.student-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:230px;overflow-y:auto}
.st-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:2px solid var(--g200);border-radius:var(--rx);cursor:pointer;transition:all .2s;background:var(--w)}
.st-row:hover{border-color:var(--p);background:#F8FAFF}.st-row.selected{border-color:var(--p);background:#E8F0FE;box-shadow:0 0 0 3px rgba(66,133,244,.06)}
.st-row .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1a237e,var(--p));color:var(--w);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;flex-shrink:0}
.st-row .info{flex:1;min-width:0}.st-row .info .nm{font-size:13px;font-weight:500;color:var(--g800)}.st-row .info .mt{font-size:10px;color:var(--g500)}
.st-row .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.st-row.selected .chk{background:var(--p);border-color:var(--p)}.st-row.selected .chk::after{content:'\2713';color:var(--w);font-size:11px;font-weight:700}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--p);font-size:11px;font-weight:500;cursor:pointer;background:none;border:none;font-family:var(--f);margin-bottom:10px;padding:4px 0;transition:color .2s}.back-btn:hover{color:var(--pd)}

@keyframes scaleIn{0%{opacity:0;transform:scale(.92) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:380px){.body{padding:16px}.top{padding:22px 16px 20px}.top h2{font-size:19px}}
</style></head><body>
<div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<div class="card">
<div class="top">
<div class="logo-wrap"><div class="logo-img"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="ln">SK PRESIDENCY PUBLIC SCHOOL</div><div class="ls">CBSE: 2133231 | Sultanpur, Uttar Pradesh</div></div>
<h2>Student Portal</h2><p>Sign in to access your dashboard</p>
</div>
<div class="body">
<div class="tabs"><button class="active" onclick="st('id')">Student ID</button><button onclick="st('mobile')">Mobile Number</button></div>
<div class="err" id="err"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<div class="ok" id="okMsg"></div>

<form id="fid" class="tc active" onsubmit="return li(event)">
<div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><input type="text" name="sid" placeholder="Student ID or Roll Number" autocomplete="off"></div>
<div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><input type="password" name="pw" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div>
<button type="submit" class="btn" id="btnid"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button>
</form>

<form id="fmb" class="tc" onsubmit="return false">
<div id="ms1"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><input type="tel" id="mi" placeholder="Registered Mobile Number" autocomplete="off" maxlength="10"></div><button type="button" class="btn" onclick="lm()" id="btnmb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account</button><div style="text-align:center;margin-top:8px;font-size:10px;color:var(--g500)">All students registered with this number will appear</div></div>
<div id="ms2" style="display:none"><button type="button" class="back-btn" onclick="goback()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Change mobile number</button><p style="font-size:11px;color:var(--g500);margin-bottom:8px">Select your name to login:</p><div class="student-list" id="sl"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><input type="password" id="pm" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="button" class="btn btn-g" onclick="ls()" id="btnls"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In as Selected</button></div>
</form>
</div>
<div class="ft"><a href="index.html">Back to School Website</a><br><span style="display:block;margin-top:3px;font-size:9px">Default password: Date of Birth (DDMMYYYY)</span></div></div>

<script>
(function(){window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}var _f=null,_p=null,_a=null;
window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db&&_a&&_a.currentUser)return ok(_f);if(!FIREBASE_CONFIG.apiKey){ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}var loaded=false,to=setTimeout(function(){if(!loaded){loaded=true;ok(null)}},15000);Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_a=firebase.auth();var db=firebase.firestore();function done(){if(loaded)return;loaded=true;clearTimeout(to);_f={db:db,auth:_a};try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}ok(_f)}var unsub=_a.onAuthStateChanged(function(user){unsub();if(user){done()}else{_a.signInAnonymously().then(done).catch(function(){done()})}})}).catch(function(e){if(!loaded){loaded=true;clearTimeout(to);ok(null)}})});return _p};
window.fs=async function(id){var f=await _fbReady();if(!f)throw new Error("Firebase not connected — run firebase-setup.html");var d=await f.db.collection('students').doc(id).get();if(d.exists){var r=d.data();r.student_id=d.id;return r}return null};
window.fp=async function(phone){var f=await _fbReady();if(!f)throw new Error("Firebase not connected — run firebase-setup.html");var s=await f.db.collection('students').where('parent_phone','==',phone).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r}).filter(function(r){return r.is_active!==false})};
window.fa=async function(){var f=await _fbReady();if(!f)throw new Error("Firebase not connected — run firebase-setup.html");var s=await f.db.collection('students').where('is_active','==',true).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r})}})();

var ms=[],ss=null;
function st(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="id"&&i===0)||(t==="mobile"&&i===1))});document.getElementById("fid").classList.toggle("active",t==="id");document.getElementById("fmb").classList.toggle("active",t==="mobile");hm()}
function se(m){document.getElementById("et").textContent=m;document.getElementById("err").classList.add("show");document.getElementById("okMsg").classList.remove("show")}
function so(m){document.getElementById("okMsg").textContent=m;document.getElementById("okMsg").classList.add("show");document.getElementById("err").classList.remove("show")}
function hm(){document.getElementById("err").classList.remove("show");document.getElementById("okMsg").classList.remove("show")}
function gd(stu){sessionStorage.setItem("skpps_auth","1");sessionStorage.setItem("skpps_name",stu.full_name||stu.name);sessionStorage.setItem("skpps_class",stu.class||stu.cls);sessionStorage.setItem("skpps_section",stu.section||stu.sec||"A");sessionStorage.setItem("skpps_roll",String(stu.roll_no||stu.roll||""));sessionStorage.setItem("skpps_house",stu.house||"Earth");sessionStorage.setItem("skpps_role","student");sessionStorage.setItem("skpps_sid",stu.student_id||stu.sid);sessionStorage.setItem("skpps_student",JSON.stringify(stu));location.href="student/dashboard.html"}
function vp(stu,pw){var d=(stu.date_of_birth||stu.dob||"").replace(/-/g,"").substring(0,8),s=stu.password||d;return pw===d||pw===s}

async function li(e){e.preventDefault();var id=this.querySelector('[name=sid]').value.trim(),pw=this.querySelector('[name=pw]').value.trim();if(!id||!pw){se("Please fill both fields");return false}hm();var b=document.getElementById("btnid");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';try{var st=await fs(id);if(!st){var al=await fa();for(var i=0;i<al.length;i++){if(al[i].roll_no==parseInt(id)||al[i].admission_no===id){st=al[i];break}}}if(st){if(vp(st,pw)){gd(st);return}se("Invalid password — default is DOB (DDMMYYYY)");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In'}else{se("Student not found — check your ID");b.disabled=false;b.innerHTML='Sign In'}}catch(e){se(e.message||"Login error");b.disabled=false;b.innerHTML='Sign In'}}

async function lm(){var m=document.getElementById("mi").value.replace(/\D/g,'');if(m.length!==10){se("Enter valid 10-digit number");return}hm();var b=document.getElementById("btnmb");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Searching...';try{ms=await fp(m);if(!ms||!ms.length){se("No student found with this number");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find Account';return}so("Found "+ms.length+" student(s). Select below.");document.getElementById("ms1").style.display="none";document.getElementById("ms2").style.display="block";var h='';for(var i=0;i<ms.length;i++){var s=ms[i];h+='<div class="st-row" onclick="sel('+i+',this)"><div class="av">'+(s.full_name||'S').charAt(0).toUpperCase()+'</div><div class="info"><div class="nm">'+xe(s.full_name)+'</div><div class="mt">Class '+xe(s.class)+'-'+(s.section||'A')+' | '+xe(s.student_id)+'</div></div><div class="chk"></div></div>'}document.getElementById("sl").innerHTML=h;ss=null}catch(e){se(e.message||"Search failed")}b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find Account'}
function sel(idx,el){document.querySelectorAll(".st-row").forEach(function(r){r.classList.remove("selected")});el.classList.add("selected");ss=ms[idx];hm()}
function goback(){document.getElementById("ms1").style.display="block";document.getElementById("ms2").style.display="none";ms=[];ss=null;hm()}
async function ls(){if(!ss){se("Select your name from the list");return}var pw=document.getElementById("pm").value.trim();if(!pw){se("Enter your password");return}hm();var b=document.getElementById("btnls");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';if(vp(ss,pw)){gd(ss);return}se("Invalid password");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In'}
function xe(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
