<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Portal — SK Presidency Public School</title>
<style>
:root{--p:#1A73E8;--pd:#1557B0;--g-grn:#34A853;--g-red:#EA4335;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g400:#BDC1C6;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:12px;--rr:28px;--f:'Google Sans','Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0d1b2a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--w);border-radius:20px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fadeIn .5s}
.top{background:linear-gradient(135deg,#1a237e,#0d47a1);padding:clamp(22px,4vw,32px);text-align:center;color:white;position:relative;overflow:hidden}
.top::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;border:2px solid rgba(255,255,255,.05);top:-80px;right:-60px}.top::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.03);bottom:-50px;left:-40px}
.idc{border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 18px;background:rgba(255,255,255,.05);display:inline-block;margin-bottom:10px;position:relative;z-index:1}.idc .logo{width:48px;height:48px;border-radius:50%;background:white;padding:3px;margin:0 auto 6px}.idc .logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}.idc .sn{font-size:10px;font-weight:700;letter-spacing:.5px}.idc .ss{font-size:8px;opacity:.5}.idc .line{width:100%;height:1px;background:rgba(255,255,255,.1);margin:4px 0}
.top h2{font-size:clamp(18px,2vw,24px);font-weight:500}.top p{font-size:12px;opacity:.7;margin-top:4px}
.body{padding:clamp(18px,3vw,28px)}
.tabs{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:18px}.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:10px;transition:all .2s;font-family:inherit}.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.ig{position:relative;margin-bottom:12px}.ig svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}.ig:focus-within svg{color:var(--p)}.ig input{width:100%;padding:13px 14px 13px 44px;border:2px solid var(--g200);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--g50);transition:all .3s}.ig input:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 4px rgba(26,115,232,.08)}
.btn{width:100%;padding:13px;background:var(--p);color:white;border:none;border-radius:var(--rr);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:var(--pd);box-shadow:0 4px 16px rgba(26,115,232,.3);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}.btn-g{background:var(--g-grn)}.btn-g:hover{opacity:.9}
.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:10px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ok{background:#ECFDF5;color:#059669;padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:10px;display:none;border-left:3px solid var(--g-grn)}.ok.show{display:block}
.ft{text-align:center;padding:0 0 20px;font-size:11px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none}.tc{display:none}.tc.active{display:block}.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
.student-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:250px;overflow-y:auto}.st-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--g200);border-radius:var(--r);cursor:pointer;transition:all .2s;background:var(--w)}.st-row:hover{border-color:var(--p);background:#F8FAFF}.st-row.selected{border-color:var(--p);background:#E8F0FE;box-shadow:0 0 0 3px rgba(26,115,232,.1)}.st-row .av{width:42px;height:42px;border-radius:50%;background:var(--p);color:white;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;flex-shrink:0}.st-row .info{flex:1;min-width:0}.st-row .info .nm{font-size:14px;font-weight:500;color:var(--g800)}.st-row .info .mt{font-size:11px;color:var(--g500)}.st-row .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}.st-row.selected .chk{background:var(--p);border-color:var(--p)}.st-row.selected .chk::after{content:'✓';color:white;font-size:12px;font-weight:700}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--p);font-size:12px;font-weight:500;cursor:pointer;background:none;border:none;font-family:inherit;margin-bottom:12px;padding:4px 0}
.scan-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;padding:10px;border:1.5px dashed var(--g300);border-radius:var(--r);font-size:13px;color:var(--p);font-weight:500;text-decoration:none;transition:all .2s}.scan-link:hover{border-color:var(--p);background:#F8FAFF}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>
<div class="card">
<div class="top">
<div class="idc"><div class="logo"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="sn">SK PRESIDENCY PUBLIC SCHOOL</div><div class="ss">Sultanpur, UP | CBSE: 2133231</div><div class="line"></div></div>
<h2>Student Portal</h2><p>Sign in to access your dashboard</p>
</div>
<div class="body">
<a href="student-scan.html" class="scan-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scan ID Card to Login</a>
<div class="tabs"><button class="active" onclick="switchTab('id')">Student ID</button><button onclick="switchTab('mobile')">Mobile</button></div>
<div class="err" id="err"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<div class="ok" id="okMsg"></div>
<form id="fid" class="tc active" onsubmit="return loginByID(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><input type="text" name="sid" placeholder="Student ID or Roll Number" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" name="pw" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="submit" class="btn" id="btnID"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<form id="fmb" class="tc" onsubmit="return false"><div id="mStep1"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><input type="tel" id="mobInput" placeholder="Registered Mobile Number" autocomplete="off" maxlength="10"></div><button type="button" class="btn" onclick="lookupMobile()" id="btnMobile"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account</button><div style="text-align:center;margin-top:8px;font-size:10px;color:var(--g500)">All students registered with this number will appear</div></div><div id="mStep2" style="display:none"><button type="button" class="back-btn" onclick="goBackToMobile()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Change mobile number</button><p style="font-size:11px;color:var(--g500);margin-bottom:10px">Select your name to login:</p><div class="student-list" id="studentList"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="pwMobile" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="button" class="btn btn-g" onclick="loginSelected()" id="btnLoginSelected"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In as Selected</button></div></form>
</div><div class="ft"><a href="index.html">Back to School Website</a><br><span style="margin-top:3px;display:block;font-size:10px">Default password: Date of Birth (DDMMYYYY)</span></div></div>

<script>
/* ===== SELF-CONTAINED FIREBASE (no external dependency) ===== */
(function(){
  window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}
  var _f=null,_p=null;
  window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db)return ok(_f);if(!FIREBASE_CONFIG.apiKey){console.warn("Firebase not configured");ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js').then(function(){return ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js')}).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_f={db:firebase.firestore()};try{_f.db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}ok(_f)}).catch(function(e){console.warn("Firebase load err",e);ok(null)})});return _p};
  window.fbFindStudent=async function(id){var f=await _fbReady();if(!f)return null;var d=await f.db.collection('students').doc(id).get();if(d.exists){var r=d.data();r.student_id=d.id;return r}return null};
  window.fbFindStudentsByPhone=async function(phone){var f=await _fbReady();if(!f)return[];try{var s=await f.db.collection('students').where('parent_phone','==',phone).where('is_active','==',true).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r})}catch(e){console.warn("Phone search error:",e);return[]}};
  window.fbGetStudents=async function(){var f=await _fbReady();if(!f)return[];var s=await f.db.collection('students').where('is_active','==',true).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r})};
})();

/* ===== APP STATE ===== */
var curTab='id',mobileStudents=[],selectedStudent=null;
function switchTab(t){curTab=t;document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="id"&&i===0)||(t==="mobile"&&i===1))});document.getElementById("fid").classList.toggle("active",t==="id");document.getElementById("fmb").classList.toggle("active",t==="mobile");hideMsgs()}
function showErr(m){document.getElementById("et").textContent=m;document.getElementById("err").classList.add("show");document.getElementById("okMsg").classList.remove("show")}
function showOk(m){document.getElementById("okMsg").textContent=m;document.getElementById("okMsg").classList.add("show");document.getElementById("err").classList.remove("show")}
function hideMsgs(){document.getElementById("err").classList.remove("show");document.getElementById("okMsg").classList.remove("show")}
function goDash(st){sessionStorage.setItem("skpps_auth","1");sessionStorage.setItem("skpps_name",st.full_name||st.name);sessionStorage.setItem("skpps_class",st.class||st.cls);sessionStorage.setItem("skpps_section",st.section||st.sec||"A");sessionStorage.setItem("skpps_roll",String(st.roll_no||st.roll||""));sessionStorage.setItem("skpps_house",st.house||"Earth");sessionStorage.setItem("skpps_role","student");sessionStorage.setItem("skpps_sid",st.student_id||st.sid);sessionStorage.setItem("skpps_student",JSON.stringify(st));location.href="student/dashboard.html"}
function verifyPassword(st,pw){var dp=(st.date_of_birth||st.dob||"").replace(/-/g,"").substring(0,8),sp=st.password||dp;return pw===dp||pw===sp}

/* ===== TAB 1: STUDENT ID ===== */
async function loginByID(e){e.preventDefault();var sid=this.querySelector('[name=sid]').value.trim(),pw=this.querySelector('[name=pw]').value.trim();if(!sid||!pw){showErr("Please fill both fields");return false}hideMsgs();var b=document.getElementById("btnID");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';
try{var st=await fbFindStudent(sid);if(!st){var all=await fbGetStudents();for(var i=0;i<all.length;i++){if(all[i].roll_no==parseInt(sid)||all[i].admission_no===sid){st=all[i];break}}}
if(st){if(verifyPassword(st,pw)){goDash(st);return}else{showErr("Invalid password. Default is DOB (DDMMYYYY).");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In';return false}}else{showErr("Student not found. Check your ID.");b.disabled=false;b.innerHTML='Sign In';return false}}catch(e){showErr("Login error: "+e.message);b.disabled=false;b.innerHTML='Sign In'}}

/* ===== TAB 2: MOBILE LOOKUP ===== */
async function lookupMobile(){var mob=document.getElementById("mobInput").value.replace(/\D/g,'');if(mob.length!==10){showErr("Please enter a valid 10-digit mobile number");return}hideMsgs();var b=document.getElementById("btnMobile");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Searching...';
try{mobileStudents=await fbFindStudentsByPhone(mob);
if(!mobileStudents||!mobileStudents.length){showErr("No students found with this mobile number. Check the number or contact school office.");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account';return}
showOk("Found "+mobileStudents.length+" student(s). Select your name below.");document.getElementById("mStep1").style.display="none";document.getElementById("mStep2").style.display="block";renderStudentList()}catch(e){showErr("Search error: "+e.message)}b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find My Account'}
function renderStudentList(){var h='';for(var i=0;i<mobileStudents.length;i++){var s=mobileStudents[i],nm=s.full_name||s.name,cl=s.class||s.cls,sc=s.section||s.sec||'A',rn=s.roll_no||s.roll||'';h+='<div class="st-row" onclick="selectStudent('+i+',this)" data-idx="'+i+'"><div class="av">'+(nm||'S').charAt(0).toUpperCase()+'</div><div class="info"><div class="nm">'+es(nm)+'</div><div class="mt">Class '+es(cl)+'-'+es(sc)+' | Roll '+es(rn)+'</div></div><div class="chk"></div></div>'}document.getElementById("studentList").innerHTML=h;selectedStudent=null}
function selectStudent(idx,el){document.querySelectorAll(".st-row").forEach(function(r){r.classList.remove("selected")});el.classList.add("selected");selectedStudent=mobileStudents[idx];hideMsgs()}
function goBackToMobile(){document.getElementById("mStep1").style.display="block";document.getElementById("mStep2").style.display="none";mobileStudents=[];selectedStudent=null;hideMsgs()}
async function loginSelected(){if(!selectedStudent){showErr("Please select your name from the list");return}var pw=document.getElementById("pwMobile").value.trim();if(!pw){showErr("Please enter your password");return}hideMsgs();var b=document.getElementById("btnLoginSelected");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';if(verifyPassword(selectedStudent,pw)){goDash(selectedStudent);return}showErr("Invalid password. Default is DOB (DDMMYYYY).");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In as Selected'}
function es(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
