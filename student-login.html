<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Portal — SK Presidency Public School</title>
<style>
:root{--p:#4285F4;--pd:#1557B0;--g:#34A853;--r:#EA4335;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--rs:14px;--rr:28px;--f:'Google Sans','Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;--sh:0 16px 48px rgba(0,0,0,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:linear-gradient(155deg,#0a0e27 0%,#141a3a 30%,#1a2050 60%,#0d1028 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(66,133,244,.08),transparent 70%);top:-200px;right:-150px}
body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(52,168,83,.06),transparent 70%);bottom:-150px;left:-100px}
.card{background:rgba(255,255,255,.97);border-radius:24px;width:100%;max-width:440px;overflow:hidden;box-shadow:var(--sh);position:relative;z-index:1;animation:scalePop .6s cubic-bezier(.16,1,.3,1)}
.top{background:linear-gradient(135deg,#1a237e,#0d47a1,#4285F4);padding:28px 24px 22px;text-align:center;color:#fff;position:relative;overflow:hidden}
.top::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;border:1.5px solid rgba(255,255,255,.04);top:-90px;right:-70px}
.top::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:1.5px solid rgba(255,255,255,.03);bottom:-50px;left:-40px}
.school-badge{border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.04);display:inline-block;margin-bottom:10px;position:relative;z-index:1}
.school-badge .l{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px;margin:0 auto 5px}.school-badge .l img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.school-badge .n{font-size:10px;font-weight:700;letter-spacing:.4px}.school-badge .s{font-size:7px;opacity:.4}
.top h2{font-size:22px;font-weight:500;letter-spacing:-.3px;position:relative;z-index:1}.top p{font-size:11px;opacity:.6;margin-top:2px;position:relative;z-index:1}
.body{padding:22px 24px 16px}
.tabs{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:10px;transition:all .2s;font-family:var(--f)}
.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:600}
.ig{position:relative;margin-bottom:12px}.ig svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}
.ig:focus-within svg{color:var(--p)}.ig input{width:100%;padding:12px 14px 12px 42px;border:2px solid var(--g200);border-radius:var(--rs);font-size:14px;font-family:var(--f);background:var(--g50);transition:all .3s}
.ig input:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(66,133,244,.07)}
.btn{width:100%;padding:12px;background:var(--p);color:#fff;border:none;border-radius:var(--rr);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--f);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--pd);box-shadow:0 6px 24px rgba(66,133,244,.3);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-g{background:var(--g)}.btn-g:hover{opacity:.9}
.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ok{background:#ECFDF5;color:#059669;padding:10px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:10px;display:none;border-left:3px solid var(--g)}.ok.show{display:block}
.ft{text-align:center;padding:0 0 20px;font-size:10px;color:var(--g500)}.ft a{color:var(--g500)}.tc{display:none}.tc.active{display:block}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.student-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:220px;overflow-y:auto}
.st-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:2px solid var(--g200);border-radius:var(--rs);cursor:pointer;transition:all .2s;background:var(--w)}
.st-row:hover{border-color:var(--p);background:#F8FAFF}.st-row.selected{border-color:var(--p);background:#E8F0FE;box-shadow:0 0 0 3px rgba(66,133,244,.08)}
.st-row .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1a237e,#4285F4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;flex-shrink:0}
.st-row .info{flex:1;min-width:0}.st-row .info .nm{font-size:13px;font-weight:500;color:var(--g800)}.st-row .info .mt{font-size:10px;color:var(--g500)}
.st-row .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.st-row.selected .chk{background:var(--p);border-color:var(--p)}.st-row.selected .chk::after{content:'\2713';color:#fff;font-size:11px;font-weight:700}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--p);font-size:11px;font-weight:500;cursor:pointer;background:none;border:none;font-family:var(--f);margin-bottom:10px;padding:4px 0}
@keyframes scalePop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:380px){.body{padding:16px}.top{padding:20px 16px 18px}.top h2{font-size:19px}}
</style></head><body>
<div class="card">
<div class="top">
<div class="school-badge"><div class="l"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="n">SK PRESIDENCY PUBLIC SCHOOL</div><div class="s">CBSE: 2133231 | Sultanpur, UP</div></div>
<h2>Student Portal</h2><p>Sign in to your dashboard</p>
</div>
<div class="body">
<div class="tabs"><button class="active" onclick="st('id')">Student ID</button><button onclick="st('mobile')">Mobile</button></div>
<div class="err" id="err"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<div class="ok" id="okMsg"></div>
<form id="fid" class="tc active" onsubmit="return li(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg><input type="text" name="sid" placeholder="Student ID or Roll Number" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><input type="password" name="pw" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="submit" class="btn" id="btnid"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In</button></form>
<form id="fmb" class="tc" onsubmit="return false"><div id="ms1"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><input type="tel" id="mi" placeholder="Registered Mobile Number" autocomplete="off" maxlength="10"></div><button type="button" class="btn" onclick="lm()" id="btnmb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find Account</button><div style="text-align:center;margin-top:8px;font-size:10px;color:var(--g500)">All students with this number will appear</div></div><div id="ms2" style="display:none"><button type="button" class="back-btn" onclick="goback()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Change number</button><p style="font-size:11px;color:var(--g500);margin-bottom:8px">Select your name:</p><div class="student-list" id="sl"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><input type="password" id="pm" placeholder="Password (DOB: DDMMYYYY)" autocomplete="off"></div><button type="button" class="btn btn-g" onclick="ls()" id="btnls"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In</button></div></form>
</div><div class="ft"><a href="index.html">School Website</a><br><span style="display:block;margin-top:3px;font-size:9px">Default password: DOB (DDMMYYYY)</span></div></div>

<script>
(function(){window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}var _f=null,_p=null,_a=null;
window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db&&_a&&_a.currentUser)return ok(_f);if(!FIREBASE_CONFIG.apiKey){ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}var loaded=false,to=setTimeout(function(){if(!loaded){loaded=true;ok(null)}},15000);Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_a=firebase.auth();var db=firebase.firestore();function done(){if(loaded)return;loaded=true;clearTimeout(to);_f={db:db,auth:_a};try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}ok(_f)}var unsub=_a.onAuthStateChanged(function(user){unsub();if(user){done()}else{_a.signInAnonymously().then(done).catch(function(){done()})}})}).catch(function(e){if(!loaded){loaded=true;clearTimeout(to);ok(null)}})});return _p};
window.fs=async function(id){var f=await _fbReady();if(!f)throw new Error("Firebase not connected");var d=await f.db.collection('students').doc(id).get();if(d.exists){var r=d.data();r.student_id=d.id;return r}return null};
window.fp=async function(phone){var f=await _fbReady();if(!f)throw new Error("Firebase not connected");var s=await f.db.collection('students').where('parent_phone','==',phone).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r}).filter(function(r){return r.is_active!==false})};
window.fa=async function(){var f=await _fbReady();if(!f)throw new Error("Firebase not connected");var s=await f.db.collection('students').where('is_active','==',true).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r})}})();

var ms=[],ss=null;
function st(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="id"&&i===0)||(t==="mobile"&&i===1))});document.getElementById("fid").classList.toggle("active",t==="id");document.getElementById("fmb").classList.toggle("active",t==="mobile");hm()}
function se(m){document.getElementById("et").textContent=m;document.getElementById("err").classList.add("show");document.getElementById("okMsg").classList.remove("show")}
function so(m){document.getElementById("okMsg").textContent=m;document.getElementById("okMsg").classList.add("show");document.getElementById("err").classList.remove("show")}
function hm(){document.getElementById("err").classList.remove("show");document.getElementById("okMsg").classList.remove("show")}
function gd(stu){sessionStorage.setItem("skpps_auth","1");sessionStorage.setItem("skpps_name",stu.full_name||stu.name);sessionStorage.setItem("skpps_class",stu.class||stu.cls);sessionStorage.setItem("skpps_section",stu.section||stu.sec||"A");sessionStorage.setItem("skpps_roll",String(stu.roll_no||stu.roll||""));sessionStorage.setItem("skpps_house",stu.house||"Earth");sessionStorage.setItem("skpps_role","student");sessionStorage.setItem("skpps_sid",stu.student_id||stu.sid);sessionStorage.setItem("skpps_student",JSON.stringify(stu));location.href="student/dashboard.html"}
function vp(stu,pw){var d=(stu.date_of_birth||stu.dob||"").replace(/-/g,"").substring(0,8),s=stu.password||d;return pw===d||pw===s}

async function li(e){e.preventDefault();var id=this.querySelector('[name=sid]').value.trim(),pw=this.querySelector('[name=pw]').value.trim();if(!id||!pw){se("Fill all fields");return false}hm();var b=document.getElementById("btnid");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';try{var st=await fs(id);if(!st){var al=await fa();for(var i=0;i<al.length;i++){if(al[i].roll_no==parseInt(id)||al[i].admission_no===id){st=al[i];break}}}if(st){if(vp(st,pw)){gd(st);return}else{se("Invalid password — default is DOB");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Sign In';return false}}else{se("Student not found — check ID");b.disabled=false;b.innerHTML='Sign In';return false}}catch(e){se(e.message||"Error");b.disabled=false;b.innerHTML='Sign In'}}

async function lm(){var m=document.getElementById("mi").value.replace(/\D/g,'');if(m.length!==10){se("Enter valid 10-digit mobile");return}hm();var b=document.getElementById("btnmb");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Searching...';try{ms=await fp(m);if(!ms||!ms.length){se("No student with this number");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find Account';return}so("Found "+ms.length+" student(s)");document.getElementById("ms1").style.display="none";document.getElementById("ms2").style.display="block";var h='';for(var i=0;i<ms.length;i++){var s=ms[i];h+='<div class="st-row" onclick="sel('+i+',this)"><div class="av">'+(s.full_name||'S').charAt(0).toUpperCase()+'</div><div class="info"><div class="nm">'+xe(s.full_name)+'</div><div class="mt">Class '+xe(s.class)+'-'+(s.section||'A')+'</div></div><div class="chk"></div></div>'}document.getElementById("sl").innerHTML=h;ss=null}catch(e){se(e.message||"Search failed")}b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find Account'}
function sel(idx,el){document.querySelectorAll(".st-row").forEach(function(r){r.classList.remove("selected")});el.classList.add("selected");ss=ms[idx];hm()}
function goback(){document.getElementById("ms1").style.display="block";document.getElementById("ms2").style.display="none";ms=[];ss=null;hm()}
async function ls(){if(!ss){se("Select your name");return}var pw=document.getElementById("pm").value.trim();if(!pw){se("Enter password");return}hm();var b=document.getElementById("btnls");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';if(vp(ss,pw)){gd(ss);return}se("Invalid password");b.disabled=false;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>Sign In'}
function xe(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
