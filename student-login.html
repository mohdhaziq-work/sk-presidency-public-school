<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - SK Presidency Public School</title>
<link rel="stylesheet" href="css/style.css">
<style>
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 20px; }
.login-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); width: 100%; max-width: 440px; overflow: hidden; animation: fadeInScale 0.6s ease; }
.login-header { background: linear-gradient(135deg, var(--primary), #0d47a1); padding: clamp(28px, 4vw, 40px) clamp(24px, 3vw, 36px); text-align: center; color: var(--white); }
.login-header .school-badge { width: clamp(70px, 10vw, 90px); height: clamp(70px, 10vw, 90px); border-radius: 50%; background: var(--white); padding: 6px; margin: 0 auto 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: float 3s ease-in-out infinite; }
.login-header .school-badge img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
.login-header h2 { font-size: clamp(18px, 2.5vw, 24px); font-weight: 700; margin-bottom: 4px; }
.login-header p { font-size: clamp(12px, 1.3vw, 14px); opacity: 0.85; }
.login-body { padding: clamp(24px, 3vw, 36px); }
.login-body .input-group { position: relative; margin-bottom: 20px; }
.login-body .input-group svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--gray-400); transition: color 0.3s; z-index: 2; }
.login-body .input-group:focus-within svg { color: var(--primary); }
.login-body input { width: 100%; padding: clamp(12px, 1.5vw, 15px) 16px clamp(12px, 1.5vw, 15px) 46px; border: 2px solid var(--gray-200); border-radius: var(--radius-md); font-size: 15px; font-family: var(--font-sans); transition: all 0.3s; background: var(--gray-50); }
.login-body input:focus { outline: none; border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px rgba(26,115,232,0.1); }
.login-body .btn-login { width: 100%; padding: clamp(12px, 1.5vw, 15px); background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 8px; }
.login-body .btn-login:hover { background: var(--primary-dark); box-shadow: 0 6px 20px rgba(26,115,232,0.35); transform: translateY(-2px); }
.login-body .btn-login:active { transform: translateY(0); }
.login-footer { text-align: center; padding: 0 36px 28px; }
.login-footer a { font-size: 13px; color: var(--gray-500); transition: color 0.2s; }
.login-footer a:hover { color: var(--primary); }
.login-footer span { display: block; margin: 8px 0; color: var(--gray-400); font-size: 12px; }
.error-msg { background: #FDE8E8; color: var(--house-red); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; border-left: 3px solid var(--house-red); }
.error-msg.show { display: block; animation: fadeInUp 0.3s ease; }

/* Floating shapes */
.login-page::before, .login-page::after { content: ''; position: fixed; border-radius: 50%; opacity: 0.06; pointer-events: none; }
.login-page::before { width: 500px; height: 500px; background: var(--house-red); top: -150px; right: -100px; animation: float 8s ease-in-out infinite; }
.login-page::after { width: 400px; height: 400px; background: var(--house-blue); bottom: -100px; left: -80px; animation: float 6s ease-in-out infinite reverse; }

@media (max-width: 480px) {
  .login-card { max-width: 100%; }
  .login-body { padding: 20px; }
  .login-footer { padding: 0 20px 24px; }
}
</style>
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-header">
    <div class="school-badge">
      <img src="images/logo-transparent.png" alt="SKPPS Logo">
    </div>
    <h2>Student Portal</h2>
    <p>SK Presidency Public School</p>
  </div>

  <div class="login-body">
    <form id="loginForm" method="post" action="api/student-auth.php">
      <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>

      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" name="student_id" id="studentId" placeholder="Student ID / Roll Number" required autocomplete="off">
      </div>

      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" name="password" id="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: -4px;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
  </div>

  <div class="login-footer">
    <a href="index.html">Back to School Website</a>
    <span>Default Password: Your Date of Birth (DDMMYYYY)</span>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  var sid = document.getElementById('studentId').value.trim();
  var pw = document.getElementById('password').value.trim();
  if (!sid || !pw) {
    e.preventDefault();
    var err = document.getElementById('errorMsg');
    err.textContent = 'Please fill in all fields.';
    err.classList.add('show');
  }
});
</script>
</body>
</html>
