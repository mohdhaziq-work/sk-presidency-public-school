<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Staff Portal — SK Presidency Public School</title>
<style>
:root{--p:#4285F4;--pd:#1557B0;--g:#34A853;--r:#EA4335;--y:#FBBC04;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--rx:10px;--rr:24px;--f:'Google Sans','Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:linear-gradient(155deg,#080c20 0%,#101630 30%,#151d45 60%,#0a0e25 100%);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:550px;height:550px;border-radius:50%;background:radial-gradient(circle,rgba(234,67,53,.1),transparent 70%);top:-180px;right:-120px}
body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(66,133,244,.08),transparent 70%);bottom:-120px;left:-80px}
.dots{position:absolute;inset:0;pointer-events:none;z-index:0}.dots span{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.15);border-radius:50%;animation:float 6s ease-in-out infinite}.dots span:nth-child(1){top:10%;left:15%;animation-delay:0s}.dots span:nth-child(2){top:20%;right:20%;animation-delay:1s}.dots span:nth-child(3){bottom:30%;left:25%;animation-delay:2s}.dots span:nth-child(4){top:60%;right:10%;animation-delay:3s}.dots span:nth-child(5){bottom:15%;right:30%;animation-delay:4s}.dots span:nth-child(6){top:40%;left:5%;animation-delay:5s}

.card{background:rgba(255,255,255,.97);border-radius:22px;width:100%;max-width:430px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.05);position:relative;z-index:1;animation:scaleIn .6s cubic-bezier(.16,1,.3,1)}

.top{background:linear-gradient(135deg,#1a237e 0%,#0d47a1 50%,#4285F4 100%);padding:28px 22px 24px;text-align:center;color:var(--w);position:relative;overflow:hidden}
.top::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;border:1.5px solid rgba(255,255,255,.05);top:-80px;right:-60px}
.top::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;border:1.5px solid rgba(255,255,255,.03);bottom:-50px;left:-40px}
.logo-wrap{border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 16px;background:rgba(255,255,255,.06);display:inline-block;margin-bottom:10px;position:relative;z-index:1;backdrop-filter:blur(4px)}
.logo-wrap .logo-img{width:44px;height:44px;border-radius:50%;background:var(--w);padding:2px;margin:0 auto 6px}.logo-wrap .logo-img img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.logo-wrap .ln{font-size:10px;font-weight:700;letter-spacing:.6px}.logo-wrap .ls{font-size:7px;opacity:.45;letter-spacing:.3px}
.top h2{font-size:22px;font-weight:500;letter-spacing:-.3px;position:relative;z-index:1}.top p{font-size:11px;opacity:.6;margin-top:2px;position:relative;z-index:1}

.body{padding:20px 22px 14px}
.tabs{display:flex;background:var(--g100);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:11px;transition:all .2s;font-family:var(--f)}
.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:600}

.ig{position:relative;margin-bottom:14px}.ig svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}
.ig:focus-within svg{color:var(--p)}.ig input{width:100%;padding:12px 14px 12px 42px;border:2px solid var(--g200);border-radius:var(--rx);font-size:14px;font-family:var(--f);background:var(--g50);transition:all .3s;color:var(--g900)}
.ig input:focus{outline:none;border-color:var(--p);background:var(--w);box-shadow:0 0 0 4px rgba(66,133,244,.07);transform:translateY(-1px)}
.ig input::placeholder{color:var(--g400)}

.btn{width:100%;padding:12px;background:var(--p);color:var(--w);border:none;border-radius:var(--rr);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--f);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--pd);box-shadow:0 6px 24px rgba(66,133,244,.35);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--rx);font-size:12px;margin-bottom:12px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ft{text-align:center;padding:0 0 18px;font-size:10px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none;transition:color .2s}.ft a:hover{color:var(--p)}.tc{display:none}.tc.active{display:block}

.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--w);border-radius:50%;animation:spin .7s linear infinite;display:none}
.banner{background:#FEF3E0;border:1.5px solid #F39C12;border-radius:var(--rx);padding:10px 14px;margin-bottom:14px;font-size:11px;color:#7a5d00;text-align:center;display:none}.banner.show{display:block}.banner a{color:#E67E22;font-weight:700}

@keyframes scaleIn{0%{opacity:0;transform:scale(.92) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:380px){.body{padding:16px}.top{padding:22px 16px 20px}.top h2{font-size:19px}}
</style></head><body>
<div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<div class="card"><div class="top">
<div class="logo-wrap"><div class="logo-img"><img src="images/logo-transparent.png" alt="SKPPS"></div><div class="ln">SK PRESIDENCY PUBLIC SCHOOL</div><div class="ls">CBSE: 2133231 | Sultanpur, Uttar Pradesh</div></div>
<h2>Staff Portal</h2><p>Management & Teacher Access</p></div>
<div class="body">
<div class="banner" id="sb"><strong>First time?</strong> <a href="firebase-setup.html">Run Firebase Setup</a></div>
<div class="tabs"><button class="active" onclick="wf('mgmt')">Management</button><button onclick="wf('tchr')">Teacher</button></div>
<div class="err" id="er"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<form id="fm" class="tc active" onsubmit="return lm(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><input type="password" id="mc2" placeholder="Security Access Code" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><input type="password" id="mp2" placeholder="Management Password" autocomplete="off"></div><button type="submit" class="btn" id="bm2">Access Management Panel</button></form>
<form id="ft" class="tc" onsubmit="return lt(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="tu3" placeholder="Teacher Username" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><input type="password" id="tp3" placeholder="Password" autocomplete="off"></div><button type="submit" class="btn" id="bt3">Sign In</button></form>
</div><div class="ft"><a href="index.html">School Website</a> | Staff Only</div></div>

<script>
(function(){window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}var _f=null,_p=null,_a=null;window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db&&_a&&_a.currentUser)return ok(_f);if(!FIREBASE_CONFIG.apiKey){ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}var loaded=false,to=setTimeout(function(){if(!loaded){loaded=true;ok(null)}},15000);Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_a=firebase.auth();var db=firebase.firestore();function done(){if(loaded)return;loaded=true;clearTimeout(to);_f={db:db,auth:_a};try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}ok(_f)}var unsub=_a.onAuthStateChanged(function(user){unsub();if(user){done()}else{_a.signInAnonymously().then(done).catch(function(){done()})}})}).catch(function(e){if(!loaded){loaded=true;clearTimeout(to);ok(null)}})});return _p};window.ftr=async function(u){var f=await _fbReady();if(!f)return null;var d=await f.db.collection('teachers').doc(u).get();return d.exists?d.data():null}})();

var MC="SKPPS@2024#ADMIN",MP="skpps#admin2024";
(function(){var s=JSON.parse(localStorage.getItem("skpps_mgmt_config")||"null");if(s&&s.code){MC=s.code;MP=s.pass}else{document.getElementById("sb").classList.add("show")}})();
function wf(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="mgmt"&&i===0)||(t==="tchr"&&i===1))});document.getElementById("fm").classList.toggle("active",t==="mgmt");document.getElementById("ft").classList.toggle("active",t==="tchr");he()}
function se(m){document.getElementById("et").textContent=m;document.getElementById("er").classList.add("show")}function he(){document.getElementById("er").classList.remove("show")}
function gM(){sessionStorage.setItem("skpps_role","mgmt");sessionStorage.setItem("skpps_name","Management");sessionStorage.setItem("skpps_auth","1");location.href="management/index.html"}
function gT(n,u){sessionStorage.setItem("skpps_role","teacher");sessionStorage.setItem("skpps_name",n);sessionStorage.setItem("skpps_user",u);sessionStorage.setItem("skpps_auth","1");location.href="staff/index.html"}
async function lm(e){e.preventDefault();var c=document.getElementById("mc2").value.trim(),p=document.getElementById("mp2").value.trim();if(!c||!p){se("Fill both fields");return false}he();var b=document.getElementById("bm2");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Verifying...';try{var fb=await _fbReady();if(fb){var doc=await fb.db.collection("settings").doc("management").get();if(doc.exists){var d=doc.data();if(c===d.security_code&&p===d.password){gM();return}}}}catch(e){}var s=JSON.parse(localStorage.getItem("skpps_mgmt_config")||"null");if(s&&s.code===c&&s.pass===p){gM();return}if(c===MC&&p===MP){gM();return}se("Invalid credentials");b.disabled=false;b.innerHTML='Access Management Panel';return false}
async function lt(e){e.preventDefault();var u=document.getElementById("tu3").value.trim(),p=document.getElementById("tp3").value.trim();if(!u||!p){se("Fill both fields");return false}he();var b=document.getElementById("bt3");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';try{var t=await ftr(u);if(t&&t.password===p){gT(t.full_name||t.name,u);return}}catch(e){}se("Invalid credentials");b.disabled=false;b.innerHTML='Sign In';return false}
</script></body></html>
