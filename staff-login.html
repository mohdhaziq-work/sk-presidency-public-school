<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal - SK Presidency Public School</title>
<script src="firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--w:#fff;--g50:#F8F9FA;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--r:8px;--rm:14px;--f:'Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:linear-gradient(160deg,#0f172a,#1e293b,#0d1b2a,#1a1a3e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--w);border-radius:var(--rm);width:100%;max-width:440px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.15);animation:fadeIn .5s}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:clamp(18px,3vw,28px);text-align:center;color:white}.top .shield{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;border:2px solid rgba(255,255,255,.2)}.top .shield svg{width:22px;height:22px;stroke:white}.top h2{font-size:clamp(16px,2vw,20px);font-weight:700}.top p{font-size:10px;opacity:.7;margin-top:2px}
.body{padding:clamp(16px,3vw,26px)}
.tabs{display:flex;border:1.5px solid var(--g200);border-radius:var(--r);overflow:hidden;margin-bottom:16px}.tabs button{flex:1;padding:10px;border:none;background:white;font-size:12px;font-weight:500;cursor:pointer;color:var(--g600);font-family:inherit;transition:all .2s}.tabs button.active{background:var(--p);color:white;font-weight:600}
.ig{position:relative;margin-bottom:10px}.ig svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g300);z-index:2;pointer-events:none}.ig input{width:100%;padding:10px 10px 10px 38px;border:2px solid var(--g200);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--g50);transition:all .3s}.ig input:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 3px rgba(26,115,232,.08)}
.btn{width:100%;padding:12px;background:var(--p);color:white;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#1557B0;transform:translateY(-2px);box-shadow:0 5px 16px rgba(26,115,232,.3)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.err{background:#FEF2F2;color:#DC2626;padding:9px 12px;border-radius:var(--r);font-size:11px;margin-bottom:10px;display:none;border-left:3px solid #DC2626;align-items:center;gap:7px}.err.show{display:flex}
.ok{background:#ECFDF5;color:#059669;padding:9px 12px;border-radius:var(--r);font-size:11px;margin-bottom:10px;display:none;border-left:3px solid #059669}.ok.show{display:block}
.ft{text-align:center;padding:0 0 16px;font-size:9px;color:var(--g400);color:#999}.ft a{color:var(--g500);text-decoration:none}
.tc{display:none}.tc.active{display:block}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
.setup-banner{background:#FEF3E0;border:1.5px solid #F39C12;border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:10px;color:#7a5d00;display:none;text-align:center}.setup-banner.show{display:block}.setup-banner a{color:#E67E22;font-weight:700}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card"><div class="top"><div class="shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h2>Staff Portal</h2><p>SK Presidency Public School</p></div>
<div class="body">
<div class="setup-banner" id="sb"><strong>First time?</strong> <a href="firebase-setup.html">Run Setup→</a> or use defaults.</div>
<div class="tabs"><button class="active" onclick="swTab('mgmt')">Management</button><button onclick="swTab('teacher')">Teacher</button></div>
<div class="err" id="err"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<form id="fm" class="tc active" onsubmit="return lm(event)"><input type="hidden" name="role" value="mgmt"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><input type="password" id="mc" placeholder="Security Access Code" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="mp" placeholder="Management Password" autocomplete="off"></div><button type="submit" class="btn" id="bm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Access Panel</button></form>
<form id="ft" class="tc" onsubmit="return lt(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="tu" placeholder="Teacher Username" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="tp" placeholder="Password" autocomplete="off"></div><button type="submit" class="btn" id="bt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/></svg>Sign In</button></form>
</div><div class="ft"><a href="index.html">School Website</a> | Staff Only</div></div>

<script>
var MGMT_CODE="SKPPS@2024#ADMIN",MGMT_PASS="skpps#admin2024";
(function(){var s=JSON.parse(localStorage.getItem("skpps_mgmt_config")||"null");if(s&&s.code){MGMT_CODE=s.code;MGMT_PASS=s.pass}else{document.getElementById("sb").classList.add("show")}})();
function swTab(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="mgmt"&&i===0)||(t==="teacher"&&i===1))});document.getElementById("fm").classList.toggle("active",t==="mgmt");document.getElementById("ft").classList.toggle("active",t==="teacher");he()}
function se(m){document.getElementById("et").textContent=m;document.getElementById("err").classList.add("show")}function he(){document.getElementById("err").classList.remove("show")}
function goMgmt(){sessionStorage.setItem("skpps_role","mgmt");sessionStorage.setItem("skpps_name","Management");sessionStorage.setItem("skpps_auth","1");location.href="management/index.html"}
function goTeacher(n,u){sessionStorage.setItem("skpps_role","teacher");sessionStorage.setItem("skpps_name",n);sessionStorage.setItem("skpps_user",u);sessionStorage.setItem("skpps_auth","1");location.href="staff/index.html"}

async function lm(e){e.preventDefault();var c=document.getElementById("mc").value.trim(),p=document.getElementById("mp").value.trim();if(!c||!p){se("Please fill both fields");return false}he();var b=document.getElementById("bm");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Verifying...';
  try{var fb=await _fbReady();if(fb&&fb.db){var doc=await fb.db.collection("settings").doc("management").get();if(doc.exists){var d=doc.data();if(c===d.security_code&&p===d.password){goMgmt();return}}}}catch(e){}
  var s=JSON.parse(localStorage.getItem("skpps_mgmt_config")||"null");if(s&&s.code===c&&s.pass===p){goMgmt();return}
  if(c===MGMT_CODE&&p===MGMT_PASS){goMgmt();return}
  se("Invalid credentials");b.disabled=false;b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Access Panel';return false}

async function lt(e){e.preventDefault();var u=document.getElementById("tu").value.trim(),p=document.getElementById("tp").value.trim();if(!u||!p){se("Please fill both fields");return false}he();var b=document.getElementById("bt");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';
  try{var t=await fbFindTeacher(u);if(t&&t.password===p){goTeacher(t.full_name||t.name,u);return}}catch(e){}
  se("Invalid teacher credentials");b.disabled=false;b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/></svg>Sign In';return false}
</script></body></html>
