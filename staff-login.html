<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal - SK Presidency Public School</title>
<script src="firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--rs:8px;--rm:14px;--sh:0 20px 50px rgba(0,0,0,0.15);--f:'Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:linear-gradient(160deg,#0f172a,#1e293b,#0d1b2a,#1a1a3e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--w);border-radius:var(--rm);width:100%;max-width:460px;overflow:hidden;box-shadow:var(--sh);animation:fi 0.5s}
.card-top{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:clamp(18px,3vw,28px);text-align:center;color:white}
.card-top .s{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;border:2px solid rgba(255,255,255,0.2)}
.card-top .s svg{width:22px;height:22px;stroke:white}
.card-top h2{font-size:clamp(15px,2vw,19px);font-weight:700}.card-top p{font-size:10px;opacity:0.7;margin-top:2px}
.card-body{padding:clamp(16px,3vw,26px)}
.tabs{display:flex;border:1.5px solid var(--g200);border-radius:var(--rs);overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border:none;background:white;font-size:11px;font-weight:500;cursor:pointer;color:var(--g600);font-family:var(--f);transition:all 0.2s}
.tabs button.active{background:var(--p);color:white;font-weight:600}
.ig{position:relative;margin-bottom:10px}
.ig svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g400);z-index:2;pointer-events:none}
.ig:focus-within svg{color:var(--p)}
.ig input{width:100%;padding:10px 10px 10px 38px;border:2px solid var(--g200);border-radius:var(--rs);font-size:12px;font-family:var(--f);background:var(--g50);transition:all 0.3s}
.ig input:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 3px rgba(26,115,232,0.08)}
.btn{width:100%;padding:11px;background:var(--p);color:white;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--f);transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#1557B0;transform:translateY(-2px);box-shadow:0 5px 16px rgba(26,115,232,0.3)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none!important}
.err{background:#FEF2F2;color:#DC2626;padding:8px 10px;border-radius:var(--rs);font-size:11px;margin-bottom:8px;display:none;border-left:3px solid #DC2626;align-items:center;gap:6px}
.err.show{display:flex}
.ok{background:#ECFDF5;color:#059669;padding:8px 10px;border-radius:var(--rs);font-size:11px;margin-bottom:8px;display:none;border-left:3px solid #059669}
.ok.show{display:block}
.ft{text-align:center;padding:0 0 16px;font-size:9px;color:var(--g400)}.ft a{color:var(--g500);text-decoration:none}
.tc{display:none}.tc.active{display:block}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
.setup-banner{background:#FEF3E0;border:1.5px solid #F39C12;border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;font-size:11px;color:#7a5d00;display:none}
.setup-banner.show{display:block}
.setup-banner a{color:#E67E22;font-weight:700}
@keyframes fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <div class="s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <h2>Staff Portal</h2><p>SK Presidency Public School</p>
  </div>
  <div class="card-body">
    <!-- First-time setup banner -->
    <div class="setup-banner" id="setupBanner">
      <strong>First time?</strong> No credentials found.
      <a href="firebase-setup.html">Run Setup →</a> or use defaults below.
    </div>

    <div class="tabs">
      <button class="active" onclick="switchTab('mgmt')">Management</button>
      <button onclick="switchTab('teacher')">Teacher</button>
    </div>

    <div class="err" id="err"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
    <div class="ok" id="okMsg"></div>

    <!-- Management -->
    <form id="fm" class="tc active" onsubmit="return loginMgmt(event)">
      <div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><input type="password" id="mc" placeholder="Security Access Code" autocomplete="off"></div>
      <div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="mp" placeholder="Management Password" autocomplete="off"></div>
      <button type="submit" class="btn" id="bm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Access Panel</button>
    </form>

    <!-- Teacher -->
    <form id="ft" class="tc" onsubmit="return loginTeacher(event)">
      <div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="tu" placeholder="Teacher Username" autocomplete="off"></div>
      <div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="tp" placeholder="Password" autocomplete="off"></div>
      <button type="submit" class="btn" id="bt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/></svg>Sign In</button>
    </form>
  </div>
  <div class="ft"><a href="index.html">School Website</a> | Staff Only</div>
</div>

<script>
/* ===== CREDENTIAL CONFIG =====
   Credentials are checked in this order:
   1) localStorage (set via firebase-setup.html)
   2) Firebase Firestore (if configured)  
   3) Build-time defaults (below) - CHANGE THESE on first login!
   ================================= */
var MGMT_CODE = "SKPPS@2024#ADMIN";
var MGMT_PASS = "skpps#admin2024";

/* ===== CHECK FOR SAVED CREDENTIALS ===== */
(function() {
  var saved = JSON.parse(localStorage.getItem("skpps_mgmt_config") || "null");
  if (saved && saved.code && saved.pass) {
    MGMT_CODE = saved.code;
    MGMT_PASS = saved.pass;
  }
  // Show setup banner if using defaults
  if (!saved || !saved.code) {
    document.getElementById("setupBanner").classList.add("show");
  }
})();

function switchTab(t) {
  document.querySelectorAll(".tabs button").forEach(function(b, i) {
    b.classList.toggle("active", (t === "mgmt" && i === 0) || (t === "teacher" && i === 1));
  });
  document.getElementById("fm").classList.toggle("active", t === "mgmt");
  document.getElementById("ft").classList.toggle("active", t === "teacher");
  hideMsg();
}

function showErr(m) { document.getElementById("et").textContent = m; document.getElementById("err").classList.add("show"); document.getElementById("okMsg").classList.remove("show"); }
function showOk(m) { document.getElementById("okMsg").textContent = m; document.getElementById("okMsg").classList.add("show"); document.getElementById("err").classList.remove("show"); }
function hideMsg() { document.getElementById("err").classList.remove("show"); document.getElementById("okMsg").classList.remove("show"); }

/* ===== MANAGEMENT LOGIN ===== */
async function loginMgmt(e) {
  e.preventDefault();
  var c = document.getElementById("mc").value.trim();
  var p = document.getElementById("mp").value.trim();
  if (!c || !p) { showErr("Please fill both fields"); return false; }
  hideMsg();
  var b = document.getElementById("bm");
  b.disabled = true; b.innerHTML = '<div class="spin" style="display:block"></div> Verifying...';

  setTimeout(async function() {
    var authed = false;

    // 1) Try Firestore
    if (typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG.apiKey && typeof initFirebase === "function") {
      try {
        var fb = await _fbReady();
        if (fb && fb.db) {
          var doc = await fb.db.collection("settings").doc("management").get();
          if (doc.exists) {
            var d = doc.data();
            if (c === d.security_code && p === d.password) authed = true;
          }
        }
      } catch(e) { console.log("Firebase check failed, trying localStorage"); }
    }

    // 2) Try localStorage
    if (!authed) {
      var saved = JSON.parse(localStorage.getItem("skpps_mgmt_config") || "null");
      if (saved && saved.code === c && saved.pass === p) authed = true;
    }

    // 3) Try build-time defaults
    if (!authed && c === MGMT_CODE && p === MGMT_PASS) authed = true;

    if (authed) {
      sessionStorage.setItem("skpps_role", "mgmt");
      sessionStorage.setItem("skpps_name", "Management");
      sessionStorage.setItem("skpps_auth", "1");
      sessionStorage.setItem("skpps_time", Date.now());
      location.href = "management/index.html";
    } else {
      showErr("Invalid credentials. Run Setup to configure.");
      b.disabled = false;
      b.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Access Panel';
    }
  }, 500);
  return false;
}

/* ===== TEACHER LOGIN ===== */
async function loginTeacher(e) {
  e.preventDefault();
  var u = document.getElementById("tu").value.trim();
  var p = document.getElementById("tp").value.trim();
  if (!u || !p) { showErr("Please fill both fields"); return false; }
  hideMsg();
  var b = document.getElementById("bt");
  b.disabled = true; b.innerHTML = '<div class="spin" style="display:block"></div> Signing in...';

  setTimeout(async function() {
    var found = false, tname = "";

    // 1) Try Firestore
    if (typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG.apiKey && typeof fbFindTeacher === "function") {
      try {
        var t = await fbFindTeacher(u);
        if (t && (t.password === p || t.pass === p)) { found = true; tname = t.full_name || t.name; }
      } catch(e) {}
    }

    // 2) Try localStorage
    if (!found) {
      var local = JSON.parse(localStorage.getItem("skpps_teachers") || "[]");
      for (var i = 0; i < local.length; i++) {
        if (local[i].username === u && local[i].password === p) { found = true; tname = local[i].full_name || local[i].name; break; }
      }
    }

    if (found) {
      sessionStorage.setItem("skpps_role", "teacher");
      sessionStorage.setItem("skpps_name", tname);
      sessionStorage.setItem("skpps_user", u);
      sessionStorage.setItem("skpps_auth", "1");
      location.href = "staff/index.html";
    } else {
      showErr("Invalid teacher credentials");
      b.disabled = false;
      b.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/></svg>Sign In';
    }
  }, 500);
  return false;
}
</script>
</body>
</html>
