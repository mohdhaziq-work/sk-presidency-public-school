<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<!-- v2.20260806.auto -->
<title>Staff Portal — SK Presidency Public School</title>

<style>
:root{--p:#1A73E8;--pd:#1557B0;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:12px;--rr:28px;--f:'Google Sans','Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0d1b2a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--w);border-radius:20px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fadeIn .5s}
.top{background:linear-gradient(135deg,#1a237e,#0d47a1);padding:clamp(24px,4vw,36px);text-align:center;color:white;position:relative;overflow:hidden}
.top::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:2px solid rgba(255,255,255,.05);top:-80px;right:-80px}.top::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(255,255,255,.03);bottom:-60px;left:-50px}
.shield{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.shield svg{width:26px;height:26px;stroke:white}
.top h2{font-size:clamp(18px,2vw,24px);font-weight:500}.top p{font-size:12px;opacity:.7;margin-top:4px}
.body{padding:clamp(20px,3vw,32px)}
.tabs{display:flex;background:var(--g100);border-radius:12px;padding:4px;margin-bottom:20px}.tabs button{flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);border-radius:10px;transition:all .2s;font-family:inherit}.tabs button.active{background:var(--w);color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.ig{position:relative;margin-bottom:14px}.ig svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--g500);z-index:2;pointer-events:none;transition:color .3s}.ig:focus-within svg{color:var(--p)}.ig input{width:100%;padding:13px 14px 13px 46px;border:2px solid var(--g200);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--g50);transition:all .3s}.ig input:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 4px rgba(26,115,232,.08)}
.btn{width:100%;padding:13px;background:var(--p);color:white;border:none;border-radius:var(--rr);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:var(--pd);box-shadow:0 4px 16px rgba(26,115,232,.3);transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.err{background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none;align-items:center;gap:8px;border-left:3px solid #DC2626}.err.show{display:flex}
.ft{text-align:center;padding:0 0 20px;font-size:11px;color:var(--g500)}.ft a{color:var(--g500);text-decoration:none}.tc{display:none}.tc.active{display:block}.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}.banner{background:#FEF3E0;border:1.5px solid #F39C12;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:11px;color:#7a5d00;text-align:center;display:none}.banner.show{display:block}.banner a{color:#E67E22;font-weight:700}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card"><div class="top"><div class="shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h2>Staff Portal</h2><p>SK Presidency Public School</p></div>
<div class="body">
<div class="banner" id="sb"><strong>First time?</strong> <a href="firebase-setup.html">Run Setup →</a> or use defaults</div>
<div class="tabs"><button class="active" onclick="swF('mgmt')">Management</button><button onclick="swF('tchr')">Teacher</button></div>
<div class="err" id="er"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span id="et"></span></div>
<form id="fm" class="tc active" onsubmit="return loginM(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><input type="password" id="mc2" placeholder="Security Access Code" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="mp2" placeholder="Management Password" autocomplete="off"></div><button type="submit" class="btn" id="bm2">Access Management Panel</button></form>
<form id="ft" class="tc" onsubmit="return loginT(event)"><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="tu3" placeholder="Teacher Username" autocomplete="off"></div><div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="tp3" placeholder="Password" autocomplete="off"></div><button type="submit" class="btn" id="bt3">Sign In</button></form>
</div><div class="ft"><a href="index.html">School Website</a> | Staff Only</div></div>
<script>
/* ===== ROBUST FIREBASE (onAuthStateChanged + Timeout Safety) ===== */
(function(){window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}var _f=null,_p=null,_a=null;window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db&&_a&&_a.currentUser)return ok(_f);if(!FIREBASE_CONFIG.apiKey){console.warn("Firebase not configured");ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}var loaded=false,to=setTimeout(function(){if(!loaded){loaded=true;console.warn("Auth timeout");ok(null)}},15000);Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_a=firebase.auth();var db=firebase.firestore();function done(){if(loaded)return;loaded=true;clearTimeout(to);_f={db:db,auth:_a};try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}ok(_f)}var unsub=_a.onAuthStateChanged(function(user){unsub();if(user){done()}else{_a.signInAnonymously().then(done).catch(function(e){console.warn("Auth err:",e.message);done()})}})}).catch(function(e){if(!loaded){loaded=true;clearTimeout(to);console.warn("Firebase load err",e);ok(null)}})});return _p};window.fbFindTeacher=async function(u){var f=await _fbReady();if(!f)return null;var d=await f.db.collection('teachers').doc(u).get();return d.exists?d.data():null}})();
/* ===== END FIREBASE MODULE ===== */

var MC="SKPPS@2024#ADMIN",MP="skpps#admin2024";
(function(){var s=JSON.parse(localStorage.getItem("skpps_mgmt_config")||"null");if(s&&s.code){MC=s.code;MP=s.pass}else{document.getElementById("sb").classList.add("show")}})();
function swF(t){document.querySelectorAll(".tabs button").forEach(function(b,i){b.classList.toggle("active",(t==="mgmt"&&i===0)||(t==="tchr"&&i===1))});document.getElementById("fm").classList.toggle("active",t==="mgmt");document.getElementById("ft").classList.toggle("active",t==="tchr");he()}
function se(m){document.getElementById("et").textContent=m;document.getElementById("er").classList.add("show")}function he(){document.getElementById("er").classList.remove("show")}
function goM(){sessionStorage.setItem("skpps_role","mgmt");sessionStorage.setItem("skpps_name","Management");sessionStorage.setItem("skpps_auth","1");location.href="management/index.html"}
function goT(n,u){sessionStorage.setItem("skpps_role","teacher");sessionStorage.setItem("skpps_name",n);sessionStorage.setItem("skpps_user",u);sessionStorage.setItem("skpps_auth","1");location.href="staff/index.html"}
async function loginM(e){e.preventDefault();var c=document.getElementById("mc2").value.trim(),p=document.getElementById("mp2").value.trim();if(!c||!p){se("Please fill both fields");return false}he();var b=document.getElementById("bm2");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Verifying...';
  try{var fb=await _fbReady();if(fb){var doc=await fb.db.collection("settings").doc("management").get();if(doc.exists){var d=doc.data();if(c===d.security_code&&p===d.password){goM();return}}}}catch(e){}
  var s=JSON.parse(localStorage.getItem("skpps_mgmt_config")||"null");if(s&&s.code===c&&s.pass===p){goM();return}
  if(c===MC&&p===MP){goM();return}
  se("Invalid credentials");b.disabled=false;b.innerHTML='Access Management Panel';return false}
async function loginT(e){e.preventDefault();var u=document.getElementById("tu3").value.trim(),p=document.getElementById("tp3").value.trim();if(!u||!p){se("Please fill both fields");return false}he();var b=document.getElementById("bt3");b.disabled=true;b.innerHTML='<div class="spin" style="display:block"></div> Signing in...';
  try{var t=await fbFindTeacher(u);if(t&&t.password===p){goT(t.full_name||t.name,u);return}}catch(e){}
  se("Invalid credentials");b.disabled=false;b.innerHTML='Sign In';return false}
</script></body></html>
