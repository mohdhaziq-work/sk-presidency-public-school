<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — SK Presidency Public School</title>
<style>
:root{--p:#1A73E8;--pd:#1557B0;--g-grn:#34A853;--g-red:#EA4335;--g-ylw:#FBBC04;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:12px;--rr:20px;--f:'Google Sans','Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:var(--g50);-webkit-font-smoothing:antialiased}
.nav-t{background:var(--w);border-bottom:1px solid var(--g200);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.nav-t .nb{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--g900)}.nav-t .nb .dot{width:9px;height:9px;border-radius:50%;background:var(--g-grn)}.nav-t button{color:var(--g600);font-size:13px;font-weight:500;padding:8px 20px;border-radius:20px;border:none;background:none;cursor:pointer;font-family:inherit;transition:all .15s}.nav-t button:hover{background:var(--g100)}.nav-t .out{color:var(--g-red)}.nav-t .out:hover{background:#FEF2F2}
.ct{max-width:1000px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}.st{background:var(--w);padding:20px;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);border:1px solid var(--g200)}.st .v{font-size:28px;font-weight:400;color:var(--g900)}.st .l{font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.card{background:var(--w);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);border:1px solid var(--g200);overflow:hidden;margin-bottom:16px}.ch{padding:14px 20px;border-bottom:1px solid var(--g100);font-weight:500;font-size:14px;display:flex;align-items:center;gap:10px;color:var(--g800)}.cb{padding:20px}
.profile{display:flex;gap:20px;align-items:start;flex-wrap:wrap}.av{width:72px;height:72px;border-radius:50%;background:var(--p);color:white;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500;flex-shrink:0}.det{flex:1;min-width:200px;font-size:14px;line-height:2.2}.det b{color:var(--g600);min-width:85px;display:inline-block;font-weight:500}
.qlinks{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:500px){.nav-t .nb{font-size:13px}.profile{flex-direction:column;align-items:center;text-align:center}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>
<div class="nav-t"><div class="nb"><div class="dot"></div>SKPPS Student Portal<span id="un"></span></div><button onclick="logout()" class="out">Logout</button></div>
<div class="ct" id="mc"></div>
<script>
(function(){
if(!sessionStorage.getItem('skpps_auth')||sessionStorage.getItem('skpps_role')!=='student'){location.href='../student-login.html'}
var sd=JSON.parse(sessionStorage.getItem('skpps_student')||'{}');
document.getElementById('un').textContent=' — '+(sd.full_name||'Student');
window.logout=function(){sessionStorage.clear();location.href='../student-login.html'}

var h='<h1 style="font-size:clamp(18px,2.5vw,26px);font-weight:500;margin-bottom:2px">Welcome, '+(sd.full_name||'Student').split(' ')[0]+'</h1>';
h+='<p style="font-size:13px;color:var(--g600);margin-bottom:20px">Class '+(sd.class||'—')+'-'+(sd.section||'A')+' | House: '+(sd.house||'Earth')+'</p>';
h+='<div class="stats"><div class="st"><div class="v">'+(sd.class||'—')+'</div><div class="l">Class</div></div><div class="st"><div class="v">'+(sd.roll_no||'—')+'</div><div class="l">Roll Number</div></div><div class="st"><div class="v">'+(sd.house||'Earth')+'</div><div class="l">House</div></div></div>';

h+='<div class="card"><div class="ch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Profile</div><div class="cb"><div class="profile"><div class="av">'+(sd.full_name||'S').charAt(0).toUpperCase()+'</div><div class="det"><div><b>Name</b> '+esc(sd.full_name)+'</div><div><b>Father</b> '+esc(sd.father_name)+'</div><div><b>Class</b> '+esc(sd.class)+'-'+esc(sd.section)+'</div><div><b>House</b> '+esc(sd.house)+'</div><div><b>Blood Group</b> '+esc(sd.blood_group)+'</div><div><b>Phone</b> '+esc(sd.parent_phone)+'</div><div><b>Date of Birth</b> '+esc(sd.date_of_birth)+'</div></div></div></div></div>';

h+='<div class="card"><div class="ch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--g-red)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Recent Notices</div><div class="cb"><p style="font-size:13px;color:var(--g600)">No new notices for your class at this time.</p></div></div>';

h+='<div class="card"><div class="ch">Quick Links</div><div class="cb"><div class="qlinks"><a href="../index.html" style="padding:10px 20px;background:var(--p);color:white;text-decoration:none;border-radius:20px;font-size:13px;font-weight:500">School Website</a><a href="#" onclick="logout()" style="padding:10px 20px;background:var(--g100);color:var(--g700);text-decoration:none;border-radius:20px;font-size:13px;font-weight:500">Logout</a></div></div></div>';

document.getElementById('mc').innerHTML=h;
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
})();
</script></body></html>
