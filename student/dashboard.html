<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Dashboard — SK Presidency Public School</title>
<style>
:root{--p:#4285F4;--pd:#1557B0;--g:#34A853;--r:#EA4335;--y:#FBBC04;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--f:'Google Sans','Segoe UI','Roboto',sans-serif;--sh:0 1px 3px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--g50);-webkit-font-smoothing:antialiased;min-height:100vh}
.nav-t{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--g200);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-t .nb{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--g900)}.nav-t .nb .dot{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
.nav-t button{color:var(--g600);font-size:13px;font-weight:500;padding:8px 20px;border-radius:24px;border:none;background:none;cursor:pointer;font-family:var(--f);transition:all .15s}
.nav-t button:hover{background:var(--g100)}.nav-t .out{color:var(--r)}.nav-t .out:hover{background:#FEF2F2}
.ct{max-width:1000px;margin:0 auto;padding:24px}
/* Hero */
.hero{background:linear-gradient(135deg,#1a237e,#0d47a1,#4285F4);border-radius:20px;padding:32px 36px;color:var(--w);margin-bottom:24px;position:relative;overflow:hidden;animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
.hero::after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;border:2px solid rgba(255,255,255,.05);top:-70px;right:-50px}
.hero h1{font-size:26px;font-weight:500;position:relative;z-index:1;letter-spacing:-.3px}.hero .sub{font-size:13px;opacity:.75;margin-top:4px;position:relative;z-index:1}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.st{background:var(--w);padding:20px;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--g200);text-align:center;transition:all .3s}.st:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.st .icon{font-size:28px;margin-bottom:6px}.st .v{font-size:22px;font-weight:400;color:var(--g900)}.st .l{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* Cards */
.card{background:var(--w);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--g200);overflow:hidden;margin-bottom:20px;animation:fadeUp .5s .15s cubic-bezier(.16,1,.3,1) both}
.ch{padding:16px 22px;border-bottom:1px solid var(--g100);font-weight:500;font-size:14px;display:flex;align-items:center;gap:10px;color:var(--g800)}.cb{padding:22px}
.profile{display:flex;gap:24px;align-items:start;flex-wrap:wrap}
.av{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--p),#0d47a1);color:var(--w);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:500;flex-shrink:0;box-shadow:0 4px 16px rgba(66,133,244,.2)}
.det{flex:1;min-width:200px;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:13px}
@media(max-width:440px){.det{grid-template-columns:1fr}}
.det .row{display:flex;align-items:baseline;gap:8px}.det .lbl{color:var(--g500);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.3px;min-width:55px}.det .val{color:var(--g800);font-weight:500}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="nav-t"><div class="nb"><div class="dot"></div>SKPPS Student Portal<span id="un"></span></div><button onclick="logout()" class="out">Logout</button></div>
<div class="ct" id="mc"></div>

<script>
(function(){
  if(!sessionStorage.getItem('skpps_auth')||sessionStorage.getItem('skpps_role')!=='student'){location.href='../student-login.html'}

  window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}
  var _db=null;
  function getDB(){if(_db)return Promise.resolve(_db);return new Promise(function(ok){if(!FIREBASE_CONFIG.apiKey){ok(null);return}function ld(u){return new Promise(function(y){var s=document.createElement('script');s.src=u;s.onload=y;document.head.appendChild(s)})}Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_db=firebase.firestore();ok(_db)}).catch(function(){ok(null)})})}

  var sid=sessionStorage.getItem('skpps_sid');
  window.logout=function(){sessionStorage.clear();location.href='../student-login.html'}

  async function loadDash(){
    var sd={};try{sd=JSON.parse(sessionStorage.getItem('skpps_student')||'{}')}catch(e){}
    if((!sd||!sd.full_name)&&sid){try{var db=await getDB();if(db){var doc=await db.collection('students').doc(sid).get();if(doc.exists){sd=doc.data();sd.student_id=sid;sessionStorage.setItem('skpps_student',JSON.stringify(sd))}}}catch(e){}}

    var nm=sd.full_name||sd.name||sessionStorage.getItem('skpps_name')||'Student';
    var cl=sd.class||sd.cls||sessionStorage.getItem('skpps_class')||'-';
    var sc=sd.section||sd.sec||sessionStorage.getItem('skpps_section')||'A';
    var hs=sd.house||sessionStorage.getItem('skpps_house')||'Earth';
    var rn=sd.roll_no||sd.roll||sessionStorage.getItem('skpps_roll')||'-';
    var fn=sd.father_name||sd.father||'-';var mn=sd.mother_name||sd.mother||'-';
    var ph=sd.parent_phone||sd.phone||'-';var db2=sd.date_of_birth||sd.dob||'-';
    var bg=sd.blood_group||'-';var gd=sd.gender||'-';

    document.getElementById('un').textContent=' - '+nm;
    var h='';
    h+='<div class="hero"><h1>Welcome, '+nm.split(' ')[0]+'</h1><div class="sub">Class '+cl+'-'+sc+' | Roll '+rn+' | '+hs+' House</div></div>';
    h+='<div class="stats"><div class="st"><div class="icon">'+ic('book')+'</div><div class="v">'+cl+'</div><div class="l">Class</div></div><div class="st"><div class="icon">'+ic('home')+'</div><div class="v">'+hs+'</div><div class="l">House</div></div><div class="st"><div class="icon">'+ic('hash')+'</div><div class="v">'+rn+'</div><div class="l">Roll No</div></div><div class="st"><div class="icon">'+ic('phone')+'</div><div class="v">'+ph+'</div><div class="l">Contact</div></div></div>';

    h+='<div class="card"><div class="ch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Profile</div><div class="cb"><div class="profile"><div class="av">'+nm.charAt(0).toUpperCase()+'</div><div class="det">';
    h+=kv('Name',nm);h+=kv('Father',fn);h+=kv('Mother',mn);h+=kv('Class',cl+'-'+sc);h+=kv('Roll No',rn);h+=kv('House',hs);h+=kv('Gender',gd);h+=kv('DOB',db2);h+=kv('Phone',ph);h+=kv('Blood',bg);
    h+='</div></div></div></div>';

    h+='<div class="card"><div class="ch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--r)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Notices</div><div class="cb"><p style="font-size:13px;color:var(--g600)">No new notices for your class right now.</p></div></div>';

    h+='<div class="card"><div class="ch">Quick Links</div><div class="cb"><div style="display:flex;gap:10px;flex-wrap:wrap"><a href="../index.html" style="padding:10px 22px;background:var(--p);color:#fff;text-decoration:none;border-radius:24px;font-size:13px;font-weight:500">School Website</a><a href="#" onclick="logout()" style="padding:10px 22px;background:var(--g100);color:var(--g700);text-decoration:none;border-radius:24px;font-size:13px;font-weight:500">Logout</a></div></div></div>';

    document.getElementById('mc').innerHTML=h;
  }

  function ic(n){var s={'book':'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>','home':'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--g)" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>','hash':'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--y)" stroke-width="1.5"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>','phone':'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--r)" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'}[n]||'';return s||''}
  function kv(l,v){return'<div class="row"><span class="lbl">'+l+'</span><span class="val">'+esc(v)+'</span></div>'}
  function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  loadDash();
})();
</script></body></html>
