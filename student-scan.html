<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan ID Card - SK Presidency Public School</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --house-red:#E74C3C;--house-blue:#3498DB;--house-green:#27AE60;--house-yellow:#F39C12;
  --primary:#1A73E8;--primary-dark:#1557B0;--white:#fff;--gray-50:#F8F9FA;
  --gray-100:#F1F3F4;--gray-200:#E8EAED;--gray-300:#DADCE0;--gray-500:#9AA0A6;
  --gray-600:#80868B;--gray-700:#5F6368;--gray-800:#3C4043;--gray-900:#202124;
  --radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-lg:0 12px 40px rgba(0,0,0,0.12);
  --font:'Segoe UI','Roboto',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(160deg,#0f172a,#1e293b,#1a1a3e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.scan-card{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:460px;overflow:hidden;box-shadow:var(--shadow-lg);animation:fadeIn 0.5s ease}

/* Header */
.scan-header{background:linear-gradient(135deg,var(--primary),#0d47a1);padding:20px 24px;text-align:center;color:white}
.scan-header h2{font-size:clamp(16px,2vw,20px);font-weight:700}
.scan-header p{font-size:12px;opacity:0.85;margin-top:4px}

/* Camera Area */
.camera-wrap{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden}
.camera-wrap video,.camera-wrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camera-wrap canvas{z-index:2}
.camera-wrap .overlay{position:absolute;inset:clamp(24px,8%,40px);border:3px dashed rgba(255,255,255,0.5);border-radius:var(--radius-md);z-index:3;pointer-events:none;animation:pulseBorder 2s infinite}
.camera-wrap .overlay::after{content:'Place ID Card Here';position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);color:white;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.5);white-space:nowrap}
@keyframes pulseBorder{0%,100%{border-color:rgba(255,255,255,0.4)}50%{border-color:rgba(255,255,255,0.8)}}

/* Progress */
.progress-wrap{padding:16px 24px;display:none}
.progress-wrap.show{display:block;animation:fadeIn 0.3s ease}
.progress-bar{height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#42a5f5);border-radius:3px;transition:width 0.3s;width:0%}
.progress-text{font-size:12px;color:var(--gray-600);text-align:center}

/* Actions */
.actions{padding:8px 24px 20px;display:flex;gap:12px}
.actions button{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-capture{background:var(--primary);color:white}
.btn-capture:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,115,232,0.35)}
.btn-capture:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-skip{background:var(--gray-50);color:var(--gray-700);border:1.5px solid var(--gray-200)}
.btn-skip:hover{background:var(--gray-100)}

/* Result */
.result{padding:12px 24px 20px;display:none}
.result.show{display:block;animation:fadeIn 0.3s ease}
.result .student-info{background:var(--gray-50);border-radius:var(--radius-sm);padding:16px;display:flex;align-items:center;gap:14px}
.result .student-info .avatar{width:48px;height:48px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.result .student-info .detail{flex:1;min-width:0}
.result .student-info .detail .name{font-size:15px;font-weight:700;color:var(--gray-900)}
.result .student-info .detail .meta{font-size:12px;color:var(--gray-600);margin-top:2px}
.result .btn-login{margin-top:12px;width:100%;padding:12px;background:var(--house-green);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s}
.result .btn-login:hover{background:#219a52;transform:translateY(-2px)}
.result .error-text{color:#DC2626;font-size:13px;text-align:center;padding:8px}
.result .try-again{width:100%;padding:10px;margin-top:8px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-family:var(--font)}

/* Footer */
.scan-footer{padding:0 24px 16px;text-align:center}
.scan-footer a{font-size:12px;color:var(--gray-500);text-decoration:none}
.scan-footer a:hover{color:var(--primary)}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;display:none}
.spinner.show{display:block}
</style>
</head>
<body>

<div class="scan-card">
  <div class="scan-header">
    <h2>Smart ID Card Scanner</h2>
    <p>Point your camera at the school ID card</p>
  </div>

  <div class="camera-wrap" id="cameraWrap">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="overlay"></div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Initializing OCR engine...</div>
  </div>

  <div class="result" id="resultWrap"></div>

  <div class="actions" id="actionBtns">
    <button class="btn-skip" onclick="window.location.href='student-login.html'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Manual Login
    </button>
    <button class="btn-capture" id="btnCapture" onclick="captureAndRecognize()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Scan ID Card
    </button>
  </div>

  <div class="scan-footer">
    <a href="index.html">Back to School Website</a>
  </div>
</div>

<script>
let stream = null;

// Start camera
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    document.getElementById('video').srcObject = stream;
  } catch(e) {
    document.getElementById('cameraWrap').innerHTML = '<div style="color:white;text-align:center;padding:40px;font-size:14px"><p>Could not access camera</p><p style="font-size:12px;opacity:0.7;margin-top:8px">Please allow camera permissions or use Manual Login</p></div>';
    document.getElementById('btnCapture').disabled = true;
  }
}
startCamera();

// Capture & Recognize
async function captureAndRecognize() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const btn = document.getElementById('btnCapture');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const resultWrap = document.getElementById('resultWrap');
  const actionBtns = document.getElementById('actionBtns');

  // Capture frame
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  // Show progress
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner show"></div> Scanning...';
  progressWrap.classList.add('show');
  resultWrap.classList.remove('show');
  resultWrap.innerHTML = '';
  progressFill.style.width = '0%';
  progressText.textContent = 'Initializing OCR engine...';

  try {
    // Step 1: OCR
    progressFill.style.width = '20%';
    progressText.textContent = 'Loading OCR engine...';

    const worker = await Tesseract.createWorker('eng');
    progressFill.style.width = '50%';
    progressText.textContent = 'Recognizing text...';

    const { data: { text } } = await worker.recognize(canvas);
    await worker.terminate();

    progressFill.style.width = '80%';
    progressText.textContent = 'Analyzing ID card data...';

    // Step 2: Parse extracted text
    const extracted = parseIDCardText(text);

    // Step 3: Search database
    progressFill.style.width = '95%';
    progressText.textContent = 'Matching student record...';

    const match = await searchStudent(extracted);

    progressFill.style.width = '100%';
    progressText.textContent = 'Done!';

    // Show result
    setTimeout(() => {
      progressWrap.classList.remove('show');
      if (match && match.found) {
        showResult(match);
      } else {
        showNotFound(extracted);
      }
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Scan Again';
    }, 800);

  } catch(e) {
    progressWrap.classList.remove('show');
    resultWrap.classList.add('show');
    resultWrap.innerHTML = '<div class="error-text">OCR failed. Please try again or use Manual Login.</div><button class="try-again" onclick="location.reload()">Try Again</button>';
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Scan Again';
  }
}

// Parse text from OCR output to extract student info
function parseIDCardText(text) {
  const clean = text.replace(/[^a-zA-Z0-9\s\/\-\.\,\:\@]/g, ' ').replace(/\s+/g, ' ').trim();
  const lines = clean.split('\n').map(l => l.trim()).filter(Boolean);

  // Try to find: Name, Class, Roll No, Student ID, Blood Group
  let name = '', className = '', rollNo = '', studentId = '', blood = '';

  for (const line of lines) {
    const l = line.toLowerCase();
    if (l.includes('name') && !name) name = line.replace(/name[: ]*/i, '').trim();
    else if (l.includes('class') && !className) className = line.replace(/class[: ]*/i, '').trim();
    else if ((l.includes('roll') || l.includes('rno')) && !rollNo) rollNo = line.replace(/(roll|rno)[: .]*/i, '').trim();
    else if ((l.includes('student id') || l.includes('admission')) && !studentId) studentId = line.replace(/(student id|admission no|adm)[: .]*/i, '').trim();
    else if ((l.includes('blood') || l.includes('bg')) && !blood) blood = line.replace(/(blood|bg|group)[: .]*/i, '').trim();
    else if (l.match(/^[a-z ]{4,30}$/i) && !name) name = line.trim();
    else if (l.match(/^(nursery|lkg|ukg|[ivx]+)$/i) && !className) className = line.trim();
    else if (l.match(/^\d{1,3}$/) && !rollNo) rollNo = line.trim();
  }

  // Also return raw text for server-side matching
  return { name, className, rollNo, studentId, blood, rawText: clean };
}

// Search student via API
async function searchStudent(extracted) {
  try {
    const formData = new FormData();
    formData.append('raw_text', extracted.rawText);
    formData.append('name', extracted.name);
    formData.append('class', extracted.className);
    formData.append('roll_no', extracted.rollNo);
    formData.append('student_id', extracted.studentId);

    const resp = await fetch('api/scan-auth.php', { method: 'POST', body: formData });
    return await resp.json();
  } catch(e) {
    return null;
  }
}

// Show matched student
function showResult(match) {
  const wrap = document.getElementById('resultWrap');
  wrap.classList.add('show');
  wrap.innerHTML = `
    <div class="student-info">
      <div class="avatar">${match.initial}</div>
      <div class="detail">
        <div class="name">${match.name}</div>
        <div class="meta">Class ${match.class}-${match.section} | Roll: ${match.roll_no} | ${match.house}</div>
      </div>
    </div>
    <button class="btn-login" onclick="loginStudent('${match.student_id}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/></svg>
      Confirm & Login
    </button>
    <button class="try-again" onclick="location.reload()">Not me? Scan Again</button>
  `;
}

// Show not found
function showNotFound(extracted) {
  const wrap = document.getElementById('resultWrap');
  wrap.classList.add('show');
  const foundText = [extracted.name, extracted.className, extracted.rollNo, extracted.studentId]
    .filter(Boolean).join(', ') || 'No readable data';
  wrap.innerHTML = `
    <div class="error-text">No matching student found.<br><small>Detected: ${foundText}</small></div>
    <button class="try-again" onclick="location.reload()">Try Again</button>
    <a href="student-login.html" style="display:block;text-align:center;margin-top:8px;color:var(--primary);font-size:13px">Manual Login</a>
  `;
}

// Login matched student
function loginStudent(studentId) {
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = 'api/scan-auth.php';
  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'confirm_login';
  input.value = studentId;
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
}

// Cleanup
window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
