<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Dashboard — SKPPS</title>
<script src="../firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--g-grn:#34A853;--g-red:#EA4335;--g-ylw:#FBBC04;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:12px;--f:'Google Sans','Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:var(--g50);-webkit-font-smoothing:antialiased}
.nav-t{background:var(--w);border-bottom:1px solid var(--g200);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.nav-t .nb{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}.nav-t .nb .dot{width:9px;height:9px;border-radius:50%;background:var(--g-grn)}.nav-t .nb .pill{background:#E3F0FD;color:var(--p);padding:3px 12px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}.nav-t button{color:var(--g600);font-size:13px;font-weight:500;padding:8px 20px;border-radius:20px;border:none;background:none;cursor:pointer;font-family:inherit}.nav-t button:hover{background:var(--g100)}.nav-t .out{color:var(--g-red)}.nav-t .out:hover{background:#FEF2F2}
.ct{max-width:1200px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}.st{background:var(--w);padding:20px;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--g200)}.st .v{font-size:28px;font-weight:400;color:var(--g900)}.st .l{font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.card{background:var(--w);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--g200);overflow:hidden}.ch{padding:14px 20px;border-bottom:1px solid var(--g100);font-weight:500;font-size:14px;display:flex;align-items:center;gap:10px}.cb{padding:20px}
.tbl{overflow-x:auto;border-radius:8px;border:1px solid var(--g200)}.tbl table{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:var(--g50);padding:10px 14px;text-align:left;font-weight:600;color:var(--g600);border-bottom:1px solid var(--g200);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.3px}.tbl td{padding:9px 14px;border-bottom:1px solid var(--g100);color:var(--g700)}.tbl tr:hover td{background:var(--g50)}
.bd{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;text-transform:uppercase}.bd-g{background:#E6F4EA;color:var(--g-grn)}.bd-r{background:#FDE8E8;color:var(--g-red)}.bd-b{background:#E3F0FD;color:var(--p)}.bd-y{background:#FEF7E0;color:#E37400}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="nav-t"><div class="nb"><div class="dot"></div>SK Presidency Public School<span class="pill">Teacher</span><span id="un" style="font-size:13px;color:var(--g600);font-weight:400"></span></div><button onclick="logout()" class="out">Logout</button></div>
<div class="ct" id="mc"></div>
<script>
(function(){
if(!sessionStorage.getItem('skpps_auth')||sessionStorage.getItem('skpps_role')!=='teacher'){location.href='../staff-login.html'}
document.getElementById('un').textContent=' — '+(sessionStorage.getItem('skpps_name')||'Teacher');
window.logout=function(){sessionStorage.clear();location.href='../staff-login.html'}

async function load(){
  document.getElementById('mc').innerHTML='<div style="text-align:center;padding:80px"><div style="width:36px;height:36px;border:3px solid #E8EAED;border-top-color:#1A73E8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px"></div><p style="color:#5F6368;font-size:14px">Loading from Firestore...</p></div>';
  var S=[];try{S=await fbGetStudents()||[]}catch(e){S=[]}
  var classes=S.length?new Set(S.map(function(s){return s.class||s.cls})).size:0,rows='';
  if(!S.length)rows='<tr><td colspan="8" style="text-align:center;padding:36px;color:var(--g500)">No students in database.</td></tr>';
  else for(var i=0;i<S.length;i++){var s=S[i],hc=s.house||'Earth',bc=(hc==='Earth'?'bd-g':hc==='Fire'?'bd-r':hc==='Water'?'bd-b':'bd-y');rows+='<tr><td style="font-size:11px;font-family:monospace">'+esc(s.student_id)+'</td><td><strong>'+esc(s.full_name)+'</strong></td><td>'+esc(s.class)+'</td><td>'+esc(s.section||'-')+'</td><td style="font-size:11px">'+esc(s.date_of_birth||'-')+'</td><td><span class="bd '+bc+'">'+hc+'</span></td><td>'+esc(s.parent_phone||'-')+'</td><td style="font-size:10px">'+esc(s.blood_group||'-')+'</td></tr>'}
  document.getElementById('mc').innerHTML='<div class="stats"><div class="st"><div class="v">'+S.length+'</div><div class="l">Total Students</div></div><div class="st"><div class="v">'+classes+'</div><div class="l">Classes</div></div></div><div class="card"><div class="ch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg>Student Directory ('+S.length+')</div><div class="cb"><input style="width:100%;padding:10px 14px;border:1.5px solid #DADCE0;border-radius:24px;font-size:13px;font-family:inherit;margin-bottom:14px" placeholder="Search students..." oninput="fs(this.value)"><div class="tbl"><table id="stbl"><tr><th>ID</th><th>Name</th><th>Class</th><th>Sec</th><th>DOB</th><th>House</th><th>Phone</th><th>Blood</th></tr>'+rows+'</table></div></div></div>'
}
window.fs=function(q){var r=document.querySelectorAll('#stbl tr');for(var i=1;i<r.length;i++)r[i].style.display=r[i].textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();
})();
</script></body></html>
