<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Dashboard — SK Presidency Public School</title>
<style>
:root{--p:#4285F4;--g:#34A853;--r:#EA4335;--y:#FBBC04;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--f:'Google Sans','Segoe UI','Roboto',sans-serif;--sh:0 1px 3px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--g50);-webkit-font-smoothing:antialiased;min-height:100vh}
.nb{background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--g200);padding:0 22px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nb .bl{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--g900)}.nb .bl .d{width:7px;height:7px;border-radius:50%;background:var(--g)}
.nb .bl .pl{background:#E3F0FD;color:var(--p);padding:2px 10px;border-radius:16px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.nb button{color:var(--g600);font-size:12px;font-weight:500;padding:7px 18px;border-radius:20px;border:none;background:none;cursor:pointer;font-family:var(--f);transition:all .15s}
.nb button:hover{background:var(--g100)}.nb .out{color:var(--r)}.nb .out:hover{background:#FEF2F2}
.ct{max-width:1200px;margin:0 auto;padding:22px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}
.st{background:var(--w);padding:20px;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--g200);transition:all .3s}.st:hover{transform:translateY(-2px)}
.st .v{font-size:30px;font-weight:400;color:var(--g900)}.st .l{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.card{background:var(--w);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--g200);overflow:hidden;animation:fadeUp .5s .1s cubic-bezier(.16,1,.3,1) both}
.ch{padding:14px 20px;border-bottom:1px solid var(--g100);font-weight:500;font-size:13px;display:flex;align-items:center;gap:9px;color:var(--g800)}.cb{padding:18px 20px}
.tbl{overflow-x:auto;border-radius:8px;border:1px solid var(--g200)}
.tbl table{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--g50);padding:10px 12px;text-align:left;font-weight:600;color:var(--g600);border-bottom:2px solid var(--g200);font-size:9px;text-transform:uppercase;letter-spacing:.4px}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--g100);color:var(--g700)}.tbl tr:hover td{background:var(--g50)}
.bd{display:inline-block;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:600;text-transform:uppercase}
.bd-g{background:#E6F4EA;color:var(--g)}.bd-r{background:#FDE8E8;color:var(--r)}.bd-b{background:#E3F0FD;color:var(--p)}.bd-y{background:#FEF7E0;color:#E37400}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="nb"><div class="bl"><div class="d"></div>SK Presidency<span class="pl">Teacher</span><span id="un" style="font-size:12px;color:var(--g600);font-weight:400"></span></div><button onclick="lg()" class="out">Logout</button></div>
<div class="ct" id="mc"></div>

<script>
(function(){window.FIREBASE_CONFIG={};var s=localStorage.getItem("skpps_firebase_config");if(s)try{FIREBASE_CONFIG=JSON.parse(s)}catch(e){}var _f=null,_p=null;window._fbReady=function(){if(_p)return _p;_p=new Promise(function(ok){if(_f&&_f.db)return ok(_f);if(!FIREBASE_CONFIG.apiKey){ok(null);return}function ld(u){return new Promise(function(y,n){if(document.querySelector('script[src="'+u+'"]'))return y();var s=document.createElement('script');s.src=u;s.onload=y;s.onerror=n;document.head.appendChild(s)})}Promise.all([ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'),ld('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js')]).then(function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);_f={db:firebase.firestore()};ok(_f)}).catch(function(){ok(null)});});return _p;};window.fbG=async function(){var f=await _fbReady();if(!f)return[];var s=await f.db.collection('students').where('is_active','==',true).get();return s.docs.map(function(d){var r=d.data();r.student_id=d.id;return r;});};})();

if(!sessionStorage.getItem('skpps_auth')||sessionStorage.getItem('skpps_role')!=='teacher'){location.href='../staff-login.html'}
document.getElementById('un').textContent=' - '+(sessionStorage.getItem('skpps_name')||'Teacher');
window.lg=function(){sessionStorage.clear();location.href='../staff-login.html'}

async function load(){
  document.getElementById('mc').innerHTML='<div style="text-align:center;padding:80px"><div style="width:32px;height:32px;border:3px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px"></div><p style="font-size:13px;color:var(--g600)">Loading...</p></div>';
  var S=[];try{S=await fbG()||[]}catch(e){S=[]}
  var cls=S.length?new Set(S.map(function(s){return s.class||s.cls})).size:0,rows='';
  if(!S.length)rows='<tr><td colspan="7" style="text-align:center;padding:36px;color:var(--g500)">No students in database.</td></tr>';
  else for(var i=0;i<S.length;i++){var s=S[i],hc=s.house||'Earth',bc=(hc==='Earth'?'bd-g':hc==='Fire'?'bd-r':hc==='Water'?'bd-b':'bd-y');rows+='<tr><td style="font-size:10px;font-family:monospace">'+xe(s.student_id)+'</td><td><strong>'+xe(s.full_name)+'</strong></td><td>'+xe(s.class)+'</td><td>'+xe(s.section||'-')+'</td><td style="font-size:10px">'+xe(s.date_of_birth||'-')+'</td><td><span class="bd '+bc+'">'+hc+'</span></td><td>'+xe(s.parent_phone||'-')+'</td></tr>'}
  document.getElementById('mc').innerHTML='<div class="stats"><div class="st"><div class="v">'+S.length+'</div><div class="l">Total Students</div></div><div class="st"><div class="v">'+cls+'</div><div class="l">Classes</div></div></div><div class="card"><div class="ch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>Student Directory ('+S.length+')</div><div class="cb"><input style="width:100%;padding:10px 14px;border:1.5px solid var(--g300);border-radius:22px;font-size:13px;font-family:var(--f);margin-bottom:14px" placeholder="Search..." oninput="fs(this.value)"><div class="tbl"><table id="stb"><tr><th>ID</th><th>Name</th><th>Class</th><th>Sec</th><th>DOB</th><th>House</th><th>Phone</th></tr>'+rows+'</table></div></div></div>'
}
window.fs=function(q){var r=document.querySelectorAll('#stb tr');for(var i=1;i<r.length;i++)r[i].style.display=r[i].textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}
function xe(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();
</script></body></html>
