<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher View - SKPPS</title>
<style>
:root{--p:#1A73E8;--hrd:#E74C3C;--hbl:#3498DB;--hgr:#27AE60;--hyl:#F39C12;--w:#fff;--g50:#F8F9FA;--g200:#E8EAED;--g300:#DADCE0;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--rs:8px;--rm:14px;--sh:0 1px 3px rgba(0,0,0,0.06);--f:'Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:var(--g50);min-height:100vh}
.tb{background:var(--g900);color:white;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb b{font-size:14px}.tb .badge{background:var(--hbl);color:white;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:700;text-transform:uppercase;margin-left:6px}
.tb a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:11px;padding:5px 12px;border-radius:14px}
.tb a:hover{background:rgba(255,255,255,0.1);color:white}
.ct{max-width:1240px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.stat{background:white;padding:16px;border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200)}
.stat .v{font-size:24px;font-weight:700;color:var(--g900)}.stat .l{font-size:10px;color:var(--g600);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.card{background:white;border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200);overflow:hidden}
.ch{padding:12px 14px;border-bottom:1px solid var(--g100);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.cb{padding:14px}
.tw{overflow-x:auto}.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{background:var(--g50);padding:7px 9px;text-align:left;font-weight:600;color:var(--g700);border-bottom:2px solid var(--g200);white-space:nowrap}
.dt td{padding:6px 9px;border-bottom:1px solid var(--g100);color:var(--g700)}.dt tr:hover td{background:var(--g50)}
.badge-sm{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:600}.bg{background:#E6F4EA;color:var(--hgr)}.br{background:#FDE8E8;color:var(--hrd)}.bb{background:#E3F0FD;color:var(--hbl)}.by{background:#FEF3E0;color:var(--hyl)}
</style></head><body>
<div class="tb"><b>SKPPS<span class="badge">Teacher</span><span id="uname"></span></b><a href="#" onclick="logout()" style="color:#f87171">Logout</a></div>
<div class="ct" id="mc"></div>
<script src="../firebase/firebase-config.js"></script>
<script>
if(!sessionStorage.getItem('skpps_auth')||sessionStorage.getItem('skpps_role')!=='teacher'){location.href='../staff-login.html'}
document.getElementById('uname').textContent=' - '+(sessionStorage.getItem('skpps_name')||'Teacher');
function gs(){try{return JSON.parse(localStorage.getItem('skpps_students')||'[]')}catch(e){return[]}}
function logout(){sessionStorage.clear();location.href='../staff-login.html'}
function renderTeacher(s){

async function loadTeacherData(){try{var fbStudents=await fbGetStudents();s=fbStudents.length?fbStudents:(JSON.parse(localStorage.skpps_students||'[]'));renderTeacher(s)}catch(e){s=JSON.parse(localStorage.skpps_students||'[]');renderTeacher(s)}}var s=[];
function renderTeacher(s){
var h='<div class="stats"><div class="stat"><div class="v">'+s.length+'</div><div class="l">Total Students</div></div><div class="stat"><div class="v">'+new Set(s.map(function(x){return x.cls})).size+'</div><div class="l">Classes</div></div></div>';
h+='<div class="card"><div class="ch">Student Directory</div><div class="cb"><input style="width:100%;padding:8px 10px;border:1.5px solid var(--g300);border-radius:var(--rs);font-size:12px;font-family:var(--f);margin-bottom:10px" placeholder="Search students..." oninput="fs(this.value)"><div class="tw"><table class="dt" id="stbl"><tr><th>ID</th><th>Name</th><th>Class</th><th>Sec</th><th>Roll</th><th>House</th><th>Phone</th><th>DOB</th></tr>';
for(var i=0;i<s.length;i++){var hc=s[i].house;h+='<tr><td>'+s[i].sid+'</td><td><strong>'+s[i].name+'</strong></td><td>'+s[i].cls+'</td><td>'+s[i].sec+'</td><td>'+s[i].roll+'</td><td><span class="badge-sm '+(hc==='Earth'?'bg':hc==='Fire'?'br':hc==='Water'?'bb':'by')+'">'+hc+'</span></td><td>'+s[i].phone+'</td><td style="font-size:10px">'+s[i].dob+'</td></tr>'}
h+='</table></div></div></div>';
document.getElementById('mc').innerHTML=h;}
loadTeacherData();}
function fs(q){var r=document.querySelectorAll('#stbl tr');for(var i=1;i<r.length;i++)r[i].style.display=r[i].textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}
</script></body></html>
