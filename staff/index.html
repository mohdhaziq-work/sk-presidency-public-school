<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard - SKPPS</title>
<script src="../firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--hb:#3498DB;--hg:#27AE60;--hr:#E74C3C;--hy:#F39C12;--w:#fff;--g50:#F8F9FA;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:8px;--rm:14px;--f:'Segoe UI','Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:var(--g50);min-height:100vh}
.tb{background:var(--g900);color:white;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.tb .l{font-size:14px}.tb .badge{background:var(--hb);color:white;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;text-transform:uppercase;margin-left:6px}.tb a{color:rgba(255,255,255,.7);text-decoration:none;font-size:11px;padding:5px 12px;border-radius:14px}.tb a:hover{background:rgba(255,255,255,.1);color:white}
.ct{max-width:1200px;margin:0 auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.stat{background:white;padding:16px;border-radius:var(--rm);box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--g200)}.stat .v{font-size:24px;font-weight:700}.stat .l{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.card{background:white;border-radius:var(--rm);box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--g200);overflow:hidden}.ch{padding:12px 14px;border-bottom:1px solid var(--g100);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.cb{padding:14px}
.tw{overflow-x:auto}.dt{width:100%;border-collapse:collapse;font-size:11px}.dt th{background:var(--g50);padding:7px 9px;text-align:left;font-weight:600;color:var(--g700);border-bottom:2px solid var(--g200);white-space:nowrap}.dt td{padding:6px 9px;border-bottom:1px solid var(--g100)}.dt tr:hover td{background:var(--g50)}.badge-sm{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;text-transform:uppercase}.bg{background:#E6F4EA;color:var(--hg)}.br{background:#FDE8E8;color:var(--hr)}.bb{background:#E3F0FD;color:var(--hb)}.by{background:#FEF3E0;color:var(--hy)}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="tb"><div class="l">SKPPS<span class="badge">Teacher</span><span id="uname"></span></div><a href="#" onclick="logout()" style="color:#f87171">Logout</a></div>
<div class="ct" id="mc"></div>
<script>
(function(){
if(!sessionStorage.getItem('skpps_auth')||sessionStorage.getItem('skpps_role')!=='teacher'){location.href='../staff-login.html'}
document.getElementById('uname').textContent=' - '+(sessionStorage.getItem('skpps_name')||'Teacher');
window.logout=function(){sessionStorage.clear();location.href='../staff-login.html'}

async function load(){
  document.getElementById('mc').innerHTML='<div style="text-align:center;padding:60px"><div style="width:32px;height:32px;border:3px solid #E8EAED;border-top-color:#1A73E8;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px"></div><p style="color:#5F6368;font-size:13px">Loading from Firestore...</p></div>';
  var s=[];try{s=await fbGetStudents()||[]}catch(e){}
  var classes=s.length?new Set(s.map(function(x){return x.class})).size:0,rows='';
  if(!s.length)rows='<tr><td colspan="8" style="text-align:center;padding:24px;color:#9AA0A6">No students in database.</td></tr>';
  else for(var i=0;i<s.length;i++){var st=s[i],hc=st.house||'Earth';rows+='<tr><td>'+esc(st.student_id)+'</td><td><strong>'+esc(st.full_name)+'</strong></td><td>'+esc(st.class)+'</td><td>'+esc(st.section)+'</td><td>'+(st.roll_no||'')+'</td><td><span class="badge-sm '+(hc==='Earth'?'bg':hc==='Fire'?'br':hc==='Water'?'bb':'by')+'">'+hc+'</span></td><td>'+esc(st.parent_phone||'')+'</td><td style="font-size:10px">'+esc(st.date_of_birth||'')+'</td></tr>'}
  document.getElementById('mc').innerHTML='<div class="stats"><div class="stat"><div class="v">'+s.length+'</div><div class="l">Total Students</div></div><div class="stat"><div class="v">'+classes+'</div><div class="l">Classes</div></div></div><div class="card"><div class="ch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg>Student Directory</div><div class="cb"><input style="width:100%;padding:8px 10px;border:1.5px solid #DADCE0;border-radius:8px;font-size:12px;font-family:inherit;margin-bottom:10px" placeholder="Search by name, class, or ID..." oninput="fs(this.value)"><div class="tw"><table class="dt" id="stbl"><tr><th>ID</th><th>Name</th><th>Class</th><th>Sec</th><th>Roll</th><th>House</th><th>Phone</th><th>DOB</th></tr>'+rows+'</table></div></div></div>';
}
window.fs=function(q){var r=document.querySelectorAll('#stbl tr');for(var i=1;i<r.length;i++)r[i].style.display=r[i].textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();
})();
</script></body></html>
