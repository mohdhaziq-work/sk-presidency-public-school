<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Management — SK Presidency Public School</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--p:#4285F4;--pd:#1557B0;--g:#34A853;--r:#EA4335;--y:#FBBC04;--hr:#E74C3C;--hb:#3498DB;--hg:#27AE60;--hy:#F39C12;--w:#fff;--bg:#F6F8FC;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g400:#BDC1C6;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--rx:8px;--rs:12px;--rm:16px;--sh:0 1px 3px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.06);--shl:0 4px 16px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.08);--f:'Google Sans','Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;--t:.3s cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--g800);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
a{color:var(--p)}

/* ===== TOP BAR ===== */
.topbar{background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--g200);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .tl{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--g900);flex-shrink:0}
.topbar .tl .dot{width:7px;height:7px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
.topbar .tl .tag{background:var(--g100);color:var(--g600);padding:1px 8px;border-radius:12px;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:none}
@media(min-width:480px){.topbar .tl .tag{display:inline}}
.topbar .tr{display:flex;align-items:center;gap:2px}
.topbar .tr .dt{color:var(--g600);font-size:11px;font-weight:500;padding:6px 10px;border-radius:16px;border:none;background:none;cursor:pointer;font-family:var(--f);transition:all var(--t);display:none}
@media(min-width:600px){.topbar .tr .dt{display:block}}
.topbar .tr .dt:hover{background:var(--g100)}
.topbar .tr .lg{color:var(--r);font-size:11px;font-weight:500;padding:6px 12px;border-radius:16px;border:none;background:none;cursor:pointer;font-family:var(--f)}
.topbar .tr .lg:hover{background:#FEF2F2}
.topbar .tr .mbtn{display:flex;align-items:center;gap:5px;color:var(--g700);font-size:11px;font-weight:500;padding:6px 10px;border-radius:16px;border:1.5px solid var(--g200);background:var(--w);cursor:pointer;font-family:var(--f)}
@media(min-width:600px){.topbar .tr .mbtn{display:none}}
.topbar .tr .mbtn span{display:block;width:16px;height:2px;background:currentColor;border-radius:1px}
.topbar .tr .mbtn span+span{margin-top:3px}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px);min-height:calc(100dvh - 56px)}
@media(max-width:600px){.layout{grid-template-columns:1fr}}

/* ===== SIDEBAR ===== */
.sidebar{background:var(--w);border-right:1px solid var(--g200);padding:12px 0;position:sticky;top:56px;height:calc(100vh - 56px);height:calc(100dvh - 56px);overflow-y:auto;display:flex;flex-direction:column}
@media(max-width:600px){.sidebar{position:fixed;left:-270px;top:56px;z-index:200;width:270px;transition:left var(--t);box-shadow:0 8px 40px rgba(0,0,0,.15);height:calc(100dvh - 56px)}.sidebar.open{left:0}}
.sidebar .sh{padding:6px 14px 14px;font-size:9px;color:var(--g500);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.sidebar nav{flex:1}
.sidebar nav button{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:1px 8px;font-size:13px;font-weight:500;color:var(--g700);border-radius:var(--rx);transition:all var(--t);border:none;background:none;width:calc(100% - 16px);cursor:pointer;font-family:var(--f);text-align:left}
.sidebar nav button:hover{background:var(--g100)}
.sidebar nav button.active{background:#e8f0fe;color:var(--p);font-weight:600}
.sidebar nav button .si{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si-db .si{background:#F3E8FF}.si-db svg{stroke:#9333EA}
.si-sc .si{background:#FDE8E8}.si-sc svg{stroke:var(--hr)}
.si-im .si{background:#E3F0FD}.si-im svg{stroke:var(--hb)}
.si-tc .si{background:#E6F4EA}.si-tc svg{stroke:var(--hg)}
.si-st .si{background:#FEF3E0}.si-st svg{stroke:var(--hy)}
.sidebar .sf{margin-top:auto;padding:12px 14px;border-top:1px solid var(--g100);font-size:10px;color:var(--g500)}
.sidebar .sf .sv{font-weight:600;color:var(--g800);margin-top:2px}

/* Backdrop */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:199}
@media(max-width:600px){.backdrop.show{display:block}}

/* ===== MAIN ===== */
.main{padding:16px}@media(min-width:600px){.main{padding:24px}}

/* ===== STATS ===== */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:480px){.stats-row{grid-template-columns:repeat(4,1fr);gap:12px}}
.stat-card{background:var(--w);border-radius:var(--rm);padding:16px 12px;box-shadow:var(--sh);border:1px solid var(--g200);transition:all var(--t);text-align:center}
.stat-card:active{transform:scale(.97)}
@media(min-width:600px){.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shl)}}
.stat-card .st-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
@media(min-width:480px){.stat-card .st-ic{width:48px;height:48px;margin-bottom:10px}}
.stat-card .st-n{font-size:26px;font-weight:400;color:var(--g900);line-height:1.1}
@media(min-width:480px){.stat-card .st-n{font-size:32px}}
.stat-card .st-l{font-size:9px;color:var(--g500);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.st-blue .st-ic{background:#E3F0FD}.st-blue svg{stroke:var(--hb);width:20px;height:20px}
.st-green .st-ic{background:#E6F4EA}.st-green svg{stroke:var(--hg);width:20px;height:20px}
.st-red .st-ic{background:#FDE8E8}.st-red svg{stroke:var(--hr);width:20px;height:20px}
.st-yellow .st-ic{background:#FEF3E0}.st-yellow svg{stroke:var(--hy);width:20px;height:20px}

/* ===== QUICK ACTIONS ===== */
.quick-acts{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
@media(min-width:480px){.quick-acts{grid-template-columns:repeat(2,1fr);gap:12px}}
.qact{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--w);border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200);cursor:pointer;transition:all var(--t);font-family:var(--f);font-size:13px;font-weight:500;color:var(--g800);text-decoration:none;text-align:left;width:100%}
.qact:active{transform:scale(.98)}@media(min-width:600px){.qact:hover{transform:translateY(-2px);box-shadow:var(--shl)}}
.qact .qa-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}@media(min-width:480px){.qact .qa-ic{width:44px;height:44px}}
.qact .qa-ic svg{width:20px;height:20px}
@media(min-width:480px){.qact .qa-ic svg{width:22px;height:22px}}
.qact .qa-info{flex:1;min-width:0}.qact .qa-info .qa-t{font-weight:600;font-size:13px}.qact .qa-info .qa-s{font-size:10px;color:var(--g500);margin-top:1px}
.qa-red .qa-ic{background:#FDE8E8}.qa-red svg{stroke:var(--hr)}
.qa-blue .qa-ic{background:#E3F0FD}.qa-blue svg{stroke:var(--hb)}
.qa-green .qa-ic{background:#E6F4EA}.qa-green svg{stroke:var(--hg)}
.qa-yellow .qa-ic{background:#FEF3E0}.qa-yellow svg{stroke:var(--hy)}

/* ===== CARDS ===== */
.crd{background:var(--w);border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200);overflow:hidden;margin-bottom:14px}
@media(min-width:600px){.crd{margin-bottom:18px}}
.crd-h{padding:12px 14px;border-bottom:1px solid var(--g100);font-weight:500;font-size:12px;display:flex;align-items:center;gap:7px;color:var(--g800)}
@media(min-width:600px){.crd-h{padding:14px 18px;font-size:13px}}
.crd-b{padding:14px}@media(min-width:600px){.crd-b{padding:18px}}

/* ===== SCANNER ===== */
.scan-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:360px){.scan-cards{grid-template-columns:1fr}}
.sc{border:2px dashed var(--g300);border-radius:var(--rm);padding:24px 12px;text-align:center;cursor:pointer;transition:all var(--t);display:flex;flex-direction:column;align-items:center;gap:6px}
.sc:active{border-color:var(--p);background:#F8FAFF}@media(min-width:600px){.sc:hover{border-color:var(--p);background:#F8FAFF;transform:translateY(-2px)}}
.sc svg{width:36px;height:36px;stroke:var(--p)}@media(min-width:480px){.sc svg{width:44px;height:44px}}
.sc h3{font-size:13px;font-weight:500}@media(min-width:480px){.sc h3{font-size:14px}}
.sc p{font-size:10px;color:var(--g500)}.sc input[type=file]{display:none}

/* ===== FORM ===== */
.form-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:500px){.form-grid{grid-template-columns:1fr 1fr;gap:12px}}
.fg input,.fg select{width:100%;padding:9px 11px;border:1.5px solid var(--g300);border-radius:var(--rx);font-size:13px;font-family:var(--f);background:var(--w);transition:all var(--t);-webkit-appearance:none}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(66,133,244,.08)}
.fg label{display:block;font-size:9px;font-weight:600;color:var(--g600);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:none;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--f);transition:all var(--t);white-space:nowrap;width:auto}
@media(min-width:480px){.btn{padding:10px 22px;font-size:13px;border-radius:24px}}
.btn-sm{padding:6px 12px;font-size:10px;border-radius:14px}@media(min-width:480px){.btn-sm{padding:7px 16px;font-size:11px;border-radius:18px}}
.btn-primary{background:var(--p);color:var(--w)}.btn-primary:active{background:var(--pd)}
.btn-outline{background:var(--w);color:var(--g700);border:1.5px solid var(--g300)}.btn-outline:active{background:var(--g50)}
.btn-green{background:var(--g);color:var(--w)}.btn-green:active{background:#2d8f46}
@media(min-width:600px){.btn-primary:hover{background:var(--pd);box-shadow:0 4px 16px rgba(66,133,244,.3)}.btn-outline:hover{background:var(--g50)}.btn-green:hover{background:#2d8f46}}

/* ===== PROGRESS ===== */
.prog{background:var(--g100);border-radius:3px;height:4px;overflow:hidden}.prog .pf{height:100%;background:var(--p);border-radius:3px;transition:width .3s ease}

/* ===== TABLE (scrollable) ===== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--rx);border:1px solid var(--g200);-webkit-mask-image:linear-gradient(to right,black 90%,transparent 100%);mask-image:linear-gradient(to right,black 90%,transparent 100%)}
.tbl{width:100%;min-width:600px;border-collapse:collapse;font-size:11px}
@media(min-width:480px){.tbl{font-size:12px;min-width:700px}}
.tbl th{background:var(--g50);padding:8px 10px;text-align:left;font-weight:600;color:var(--g600);border-bottom:2px solid var(--g200);white-space:nowrap;font-size:8px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
@media(min-width:480px){.tbl th{padding:10px 12px;font-size:9px}}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--g100);color:var(--g700)}@media(min-width:480px){.tbl td{padding:8px 12px}}
.tbl tr:active td{background:var(--g50)}@media(min-width:600px){.tbl tr:hover td{background:var(--g50)}}
.tbl .mono{font-family:monospace;font-size:9px}@media(min-width:480px){.tbl .mono{font-size:10px}}

/* ===== BADGES ===== */
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:8px;font-weight:600;text-transform:uppercase}.bdg-g{background:#E6F4EA;color:var(--g)}.bdg-r{background:#FDE8E8;color:var(--r)}.bdg-b{background:#E3F0FD;color:var(--p)}.bdg-y{background:#FEF7E0;color:#E37400}

/* ===== CAMERA MODAL ===== */
#camModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#camModal.open{display:flex}
#camModal video{border-radius:12px;max-height:60vh;max-height:60dvh;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#camModal .cam-guide{position:relative;display:inline-block}
#camModal .cam-guide::after{content:'';position:absolute;inset:6% 8%;border:2px dashed rgba(255,255,255,.35);border-radius:10px;pointer-events:none}
#camModal .cam-btns{margin-top:14px;display:flex;gap:10px}
#camModal .cam-btns button{padding:11px 26px;border-radius:22px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--f);border:none}
@media(min-width:480px){#camModal .cam-btns button{padding:12px 30px;font-size:14px;border-radius:24px}}
.cam-capture{background:var(--p);color:var(--w)}.cam-capture:active{background:var(--pd)}
.cam-cancel{background:rgba(255,255,255,.08);color:var(--w);border:1.5px solid rgba(255,255,255,.15)}

/* ===== STATUS ===== */
.st-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
@media(min-width:480px){.st-grid{grid-template-columns:1fr 1fr;gap:12px}}
.st-box{background:var(--g50);border-radius:var(--rx);padding:14px}
.st-box .stb-lbl{font-size:9px;color:var(--g500);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.st-box .stb-val{font-size:15px;font-weight:500}@media(min-width:480px){.st-box .stb-val{font-size:16px}}

/* ===== SEARCH ===== */
.search-bar{width:100%;padding:9px 12px;border:1.5px solid var(--g300);border-radius:20px;font-size:12px;font-family:var(--f);margin-bottom:12px;transition:all var(--t);background:var(--w)}.search-bar:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(66,133,244,.06)}

/* ===== OCR RAW ===== */
.ocr-raw{display:none;background:var(--g50);border-radius:var(--rx);padding:10px;margin-bottom:10px;font-family:monospace;font-size:9px;white-space:pre-wrap;max-height:80px;overflow:auto;color:var(--g600);word-break:break-all}

/* ===== LOADING ===== */
.loading{text-align:center;padding:48px 12px}
.loading .spinner{width:28px;height:28px;border:2.5px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
.loading p{color:var(--g600);font-size:12px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tl"><div class="dot"></div>SKPPS<span class="tag">Management</span><span id="un" style="font-size:10px;color:var(--g500);font-weight:400;margin-left:2px"></span></div>
  <div class="tr">
    <button onclick="navTo('scan')" class="dt">Scanner</button>
    <button onclick="navTo('teachers')" class="dt">Teachers</button>
    <button onclick="navTo('students')" class="dt">Students</button>
    <button class="mbtn" id="menuBtn"><span></span><span></span>Menu</button>
    <button onclick="lg()" class="lg">Logout</button>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sh">Navigation</div>
    <nav>
      <button class="active si-db" onclick="navTo('db')"><span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>Dashboard</button>
      <button class="si-sc" onclick="navTo('scan')"><span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></span>ID Card Scanner</button>
      <button class="si-im" onclick="navTo('import')"><span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>Bulk Import</button>
      <button class="si-tc" onclick="navTo('teachers')"><span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Teachers</button>
      <button class="si-st" onclick="navTo('students')"><span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>All Students</button>
    </nav>
    <div class="sf"><div>SK Presidency Public School</div><div class="sv">Management v5</div></div>
  </aside>
  <div class="main" id="mainContent"></div>
</div>

<div id="camModal"><div class="cam-guide"><video id="camVideo" autoplay playsinline></video></div><div class="cam-btns"><button class="cam-capture" onclick="capturePhoto()">Capture</button><button class="cam-cancel" onclick="closeCamera()">Cancel</button></div></div>

<script src="panel-v2.js"></script>
</body>
</html>
