<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management Panel - SK Presidency Public School</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="../firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--pd:#1557B0;--hrd:#E74C3C;--hbl:#3498DB;--hgr:#27AE60;--hyl:#F39C12;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--rs:10px;--rm:16px;--sh:0 1px 3px rgba(0,0,0,0.06);--sh2:0 4px 16px rgba(0,0,0,0.08);--f:'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:var(--g50);color:var(--g800);min-height:100vh}
.tb{background:var(--g900);color:white;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb .l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tb .l .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
.tb .badge{background:var(--hyl);color:#000;padding:2px 10px;border-radius:12px;font-size:9px;font-weight:800;text-transform:uppercase;margin-left:4px}
.tb nav{display:flex;gap:2px}.tb nav a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:11px;padding:6px 14px;border-radius:16px;transition:all 0.2s}.tb nav a:hover{background:rgba(255,255,255,0.1);color:white}
.ct{max-width:1280px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:white;padding:18px;border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200);transition:all 0.2s}.stat:hover{box-shadow:var(--sh2)}
.stat .v{font-size:28px;font-weight:700;color:var(--g900)}.stat .l{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}
.tab-bar{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--g200)}
.tab-bar button{padding:10px 20px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);position:relative;font-family:var(--f);transition:all 0.2s}
.tab-bar button::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:transparent;transition:all 0.2s}
.tab-bar button.active{color:var(--p);font-weight:600}.tab-bar button.active::after{background:var(--p)}
.card{background:white;border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200);overflow:hidden;margin-bottom:16px}
.ch{padding:14px 18px;border-bottom:1px solid var(--g100);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--g800)}
.cb{padding:18px}.fg{margin-bottom:10px}.fg label{display:block;font-size:11px;font-weight:600;color:var(--g700);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.3px}.fg input,.fg select{width:100%;padding:9px 11px;border:1.5px solid var(--g300);border-radius:var(--rs);font-size:12px;font-family:var(--f);transition:all 0.2s}.fg input:focus,.fg select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(26,115,232,0.08)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:500px){.r2{grid-template-columns:1fr}}.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:600px){.r3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--f);transition:all 0.25s;text-decoration:none}.btn:active{transform:scale(0.97)}
.btn-b{background:var(--p);color:white}.btn-b:hover{background:var(--pd);box-shadow:0 4px 12px rgba(26,115,232,0.25)}.btn-b:disabled{opacity:0.5;cursor:not-allowed}
.btn-g{background:var(--hgr);color:white}.btn-g:hover{opacity:0.9}
.btn-o{background:white;color:var(--g700);border:1.5px solid var(--g300)}.btn-o:hover{background:var(--g50)}
.btn-block{width:100%}.btn-lg{padding:14px 24px;font-size:15px}
.alert{padding:10px 14px;border-radius:var(--rs);font-size:12px;margin-bottom:10px}.aok{background:#ECFDF5;color:#059669;border-left:3px solid #059669}.aerr{background:#FEF2F2;color:#DC2626;border-left:3px solid #DC2626}
.tw{overflow-x:auto}.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{background:var(--g50);padding:8px 10px;text-align:left;font-weight:600;color:var(--g700);border-bottom:2px solid var(--g200);white-space:nowrap}
.dt td{padding:7px 10px;border-bottom:1px solid var(--g100);color:var(--g700)}.dt tr:hover td{background:var(--g50)}
.badge-sm{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}.bg{background:#E6F4EA;color:var(--hgr)}.br{background:#FDE8E8;color:var(--hrd)}.bb{background:#E3F0FD;color:var(--hbl)}.by{background:#FEF3E0;color:var(--hyl)}
.mt1{margin-top:8px}.mt2{margin-top:14px}.mb2{margin-bottom:14px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite}
/* Scanner specific */
.scanner-layout{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.scanner-layout{grid-template-columns:1fr}}
.cam-container{position:sticky;top:68px}
.cam-view{background:#000;border-radius:var(--rs);overflow:hidden;position:relative;aspect-ratio:3/4;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.cam-view video{width:100%;height:100%;object-fit:cover;display:block}
.cam-view .id-frame{position:absolute;inset:8% 10%;border:2.5px dashed rgba(255,255,255,0.45);border-radius:14px;pointer-events:none;z-index:2}
.cam-view .frame-label{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:5px 16px;border-radius:16px;font-size:10px;font-weight:500;z-index:3;white-space:nowrap}
.cam-view .captured-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:4;display:flex;align-items:center;justify-content:center;display:none}
.cam-view .captured-overlay.show{display:flex}
.cam-view .captured-overlay .check{width:64px;height:64px;border-radius:50%;background:var(--hgr);display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s}
.cam-view .captured-overlay .check svg{width:32px;height:32px;stroke:white;stroke-width:3}
.cam-actions{display:flex;gap:10px;margin-top:12px;max-width:360px}
.result-panel{animation:fadeIn 0.4s}.result-panel .card{border:2px solid #4ade80}
.processing-state{text-align:center;padding:40px 20px}.processing-state .spinner-big{width:40px;height:40px;border:3px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
.processing-state p{font-size:13px;color:var(--g600);margin-top:8px}
</style>
</head>
<body>
<div class="tb">
  <div class="l"><div class="dot"></div>SK Presidency<b> Public School</b><span class="badge">Management</span><span id="uname" style="font-weight:400;font-size:11px;opacity:0.7"></span></div>
  <nav><a href="#scanner" onclick="showTab('scan')">ID Scanner</a><a href="#import" onclick="showTab('bulk')">Import</a><a href="#teachers" onclick="showTab('teacher')">Teachers</a><a href="#students" onclick="showTab('all')">Students</a><a href="#logout" onclick="logout()" style="color:#f87171">Logout</a></nav>
</div>
<div class="ct" id="mc"></div>
<script src="panel.js"></script>
</body>
</html>
