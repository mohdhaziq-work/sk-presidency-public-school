<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management - SK Presidency Public School</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="../firebase/firebase-config.js"></script>
<style>
:root{--p:#1A73E8;--pd:#1557B0;--hr:#E74C3C;--hb:#3498DB;--hg:#27AE60;--hy:#F39C12;--w:#fff;--g50:#F8F9FA;--g100:#F1F3F4;--g200:#E8EAED;--g300:#DADCE0;--g500:#9AA0A6;--g600:#80868B;--g700:#5F6368;--g800:#3C4043;--g900:#202124;--r:10px;--rm:14px;--sh:0 1px 3px rgba(0,0,0,.06);--f:'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--f);background:var(--g50);color:var(--g800);min-height:100vh}
.tb{background:var(--g900);color:white;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb b{font-size:14px}.tb .badge{background:var(--hy);color:#000;padding:2px 10px;border-radius:12px;font-size:9px;font-weight:800;text-transform:uppercase;margin:0 6px}
.tb nav a{color:rgba(255,255,255,.7);text-decoration:none;font-size:11px;padding:6px 14px;border-radius:16px;transition:all .2s}.tb nav a:hover{background:rgba(255,255,255,.1);color:white}
.ct{max-width:1280px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:white;padding:18px;border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200)}.stat .v{font-size:28px;font-weight:700;color:var(--g900)}.stat .l{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.tab-bar{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--g200)}
.tab-bar button{padding:10px 20px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);position:relative;font-family:var(--f);transition:all .2s}
.tab-bar button::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:transparent;transition:all .2s}
.tab-bar button.active{color:var(--p);font-weight:600}.tab-bar button.active::after{background:var(--p)}
.card{background:white;border-radius:var(--rm);box-shadow:var(--sh);border:1px solid var(--g200);overflow:hidden;margin-bottom:16px}.ch{padding:12px 16px;border-bottom:1px solid var(--g100);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}.cb{padding:16px}
.fg{margin-bottom:8px}.fg label{display:block;font-size:10px;font-weight:600;color:var(--g700);margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select{width:100%;padding:8px 10px;border:1.5px solid var(--g300);border-radius:var(--r);font-size:12px;font-family:var(--f)}.fg input:focus,.fg select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(26,115,232,.08)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:500px){.r2{grid-template-columns:1fr}} .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:600px){.r3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--f);transition:all .25s}.btn:active{transform:scale(.97)}.btn-b{background:var(--p);color:white}.btn-b:hover{background:var(--pd)}.btn-b:disabled{opacity:.5;cursor:not-allowed}.btn-g{background:var(--hg);color:white}.btn-o{background:white;color:var(--g700);border:1.5px solid var(--g300)}.btn-o:hover{background:var(--g50)}
.alert{padding:10px 14px;border-radius:var(--r);font-size:11px;margin-bottom:8px}.aok{background:#ECFDF5;color:#059669;border-left:3px solid #059669}.aerr{background:#FEF2F2;color:#DC2626;border-left:3px solid #DC2626}
.tw{overflow-x:auto}.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{background:var(--g50);padding:7px 9px;text-align:left;font-weight:600;color:var(--g700);border-bottom:2px solid var(--g200);white-space:nowrap}
.dt td{padding:6px 9px;border-bottom:1px solid var(--g100)}.dt tr:hover td{background:var(--g50)}
.badge-sm{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;text-transform:uppercase}.bg{background:#E6F4EA;color:var(--hg)}.br{background:#FDE8E8;color:var(--hr)}.bb{background:#E3F0FD;color:var(--hb)}.by{background:#FEF3E0;color:var(--hy)}
.mt1{margin-top:8px}.mt2{margin-top:14px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}
.progress-wrap{background:var(--g100);border-radius:4px;height:6px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),#42a5f5);border-radius:4px;transition:width .3s;width:0%}
.scan-options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.scan-opt{background:white;border:2px dashed var(--g300);border-radius:var(--rm);padding:clamp(20px,4vw,36px);text-align:center;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:160px}
.scan-opt:hover{border-color:var(--p);background:#f8faff;transform:translateY(-2px);box-shadow:0 4px 16px rgba(26,115,232,.1)}
.scan-opt svg{width:40px;height:40px;stroke:var(--p);stroke-width:1.5}.scan-opt h3{font-size:14px;font-weight:600}.scan-opt p{font-size:11px;color:var(--g600)}.scan-opt input[type=file]{display:none}
#camModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#camModal.open{display:flex}#camModal video{border-radius:var(--rm);max-height:65vh;max-width:85vw;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#camModal .guide{position:relative;display:inline-block}#camModal .guide::after{content:'';position:absolute;inset:8% 10%;border:2px dashed rgba(255,255,255,.5);border-radius:14px}
</style>
</head>
<body>
<div class="tb"><b>SK Presidency Public School</b><span class="badge">Management</span><span id="uname"></span>
<nav><a href="#scan" onclick="navTo('scan')">Scanner</a><a href="#import" onclick="navTo('bulk')">Import</a><a href="#teachers" onclick="navTo('teacher')">Teachers</a><a href="#all" onclick="navTo('all')">Students</a><a href="#logout" onclick="logout()" style="color:#f87171">Logout</a></nav></div>
<div class="ct" id="mc"></div>
<div id="camModal"><div class="guide"><video id="camVid" autoplay playsinline></video></div><div style="margin-top:20px;display:flex;gap:12px"><button onclick="capturePhoto()" style="padding:14px 32px;background:#1A73E8;color:white;border:none;border-radius:28px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">Capture</button><button onclick="closeCam()" style="padding:12px 24px;background:rgba(255,255,255,.1);color:white;border:1.5px solid rgba(255,255,255,.3);border-radius:28px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit">Cancel</button></div></div>
<script src="panel.js"></script>
</body>
</html>
