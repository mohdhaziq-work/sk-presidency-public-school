<script language="JavaScript" type="text/javascript">

function Checker(obj)
{
	if (obj.Name.value == "")
	{
		alert("Please enter your name and retry.");
		obj.Name.focus();
		return false;
	}
		
	else
		if (obj.ClassSecRoll.value == "")
	{
		alert("Please enter class, section name and roll no. and retry.");
		obj.ClassSecRoll.focus();
		return false;
	}
	
	
	else
		if (obj.Contact.value == "")
	{
		alert("Please enter your contact no. and retry.");
		obj.Contact.focus();
		return false;
	}
		
	
	else
		if (obj.Email.value == "")
	{
		alert("Please enter your email address and retry.");
		obj.Email.focus();
		return false;
	}
	
	else
		if (obj.Query.value == "")
	{
		alert("Please your message to the teacher and retry.");
		obj.Query.focus();
		return false;
	}
		
	else
		if (obj.uploadedfile.value == "")
	{
		alert("Please upload your resume and retry.");
		obj.uploadedfile.focus();
		return false;
	}	
					
	return true;
}
</script>
